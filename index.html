<style>
/* Layout: gala-affiche in zwart en goud — gouden titel, vaste scorebalk, één kolom, vier gouden antwoordknoppen A-D */
:root{

*{box-sizing:border-box}
.bokeh{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(circle at 8% 18%,rgba(255,206,110,.22) 0 26px,transparent 60px),

  radial-gradient(circle at 85% 70%,rgba(255,190,90,.14) 0 30px,transparent 80px),
  radial-gradient(circle at 15% 82%,rgba(255,215,130,.12) 0 50px,transparent 110px),
  radial-gradient(circle at 50% 40%,rgba(120,70,10,.25),transparent 70%),
  radial-gradient(ellipse at 50% 0%,rgba(232,189,92,.16),transparent 55%)}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-block:10px 48px;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1100px}
.masthead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:6px 0}
.masthead .pre{font-family:var(--display);font-size:11px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase;padding-left:.42em}
.masthead h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,72px);line-height:.95;letter-spacing:.02em;background:var(--goldfill);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(232,170,60,.35))}
.masthead .script{font-family:var(--script);font-size:clamp(36px,10vw,62px);line-height:1;color:var(--gold-hi);margin-top:2px;text-shadow:0 0 18px rgba(255,200,100,.45)}
.masthead .date{display:flex;align-items:center;gap:12px;width:100%;max-width:440px;font-family:var(--display);font-size:12px;letter-spacing:.32em;color:var(--fg);text-transform:uppercase;margin-top:8px}
.masthead .date::before,.masthead .date::after{content:"";flex:1;height:1px;background:var(--line)}

h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;color:var(--gold);letter-spacing:.04em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:13px;margin:0;color:var(--dim);letter-spacing:.28em;text-transform:uppercase}
.label{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.24em;color:var(--dim)}
.q-text{font-family:var(--read);font-weight:600;font-size:clamp(28px,7.4vw,40px);line-height:1.1;color:var(--fg);margin:0;text-wrap:balance}
.round{font-family:var(--script);font-size:30px;line-height:1;color:var(--gold-hi)}
.muted{color:var(--dim)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,80px);line-height:1;background:var(--goldfill);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-family:var(--read);font-weight:600;font-size:26px;line-height:1.05;text-align:left;color:var(--fg);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.opt:not(:disabled):active{transform:scale(.98)}

.opt .k{background:var(--goldfill)}.opt.picked .k,.opt.right .k{background:var(--ink);color:var(--gold-hi)}

.timer{height:6px;background:rgba(232,189,92,.15);position:relative;border-radius:3px;overflow:hidden}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.teams{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.team{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;font-family:var(--read);font-weight:600;font-size:24px;line-height:1.05;background:rgba(0,0,0,.45);border:1px solid rgba(232,189,92,.18);border-radius:3px}

.team .pts{font-family:var(--display);font-weight:700;font-size:20px;color:var(--yellow);font-variant-numeric:tabular-nums}
.team .plus{font-family:var(--display);color:var(--green);font-size:16px}
.team.pick{cursor:pointer;width:100%;color:var(--fg);text-align:left}
.team.pick.on{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi),0 0 22px rgba(255,200,90,.3)}
.sw.magenta{background:var(--magenta)}.sw.cyan{background:var(--cyan)}.sw.yellow{background:var(--yellow)}

<script>
/* ---------- Verbinding via een publieke berichtenserver (MQTT over WebSocket) ----------
   De spelleider blijft de baas: alleen de spelleider beslist over de spelstand.
   Telefoons sturen alleen hun eigen naam, foto en antwoord op. */
(function(){
  const QS=new URLSearchParams(location.search);
  const JOIN=QS.get('join');
  const IS_HOST=!JOIN;
  const BROKERS=QS.get('broker')?[QS.get('broker')]:['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
  const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
  const rid=(n=10)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
  const PUBLIC=p=>p==='game/state'||p.startsWith('players/');
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const enc=v=>JSON.stringify(v),dec=b=>{try{const s=typeof b==='string'?b:new TextDecoder().decode(b);return s?JSON.parse(s):null;}catch(e){return undefined;}};
  const NET=window.NET={offset:0,onlinePids:()=>new Set(),tv:!!QS.get('tv')&&!IS_HOST,host:IS_HOST,status:'connecting',peers:0,hostId:null,pid:null,code:'',onchange:()=>{}};

  function makeStore(data,writer){
    let subs=[];const ready={v:false};
    const notify=()=>{if(!ready.v)return;setTimeout(()=>subs.slice().forEach(f=>{try{f();}catch(e){console.error(e);}}),0);};
    const snap=p=>({id:p.split('/').pop(),exists:data[p]!==undefined,data:()=>clone(data[p]),metadata:{fromCache:false,hasPendingWrites:false}});
    function doc(p){return{path:p,id:p.split('/').pop(),get:async()=>snap(p),
      set:async v=>writer(p,clone(v)),update:async v=>writer(p,Object.assign({},data[p],clone(v))),delete:async()=>writer(p,null),
      onSnapshot(n){const f=()=>n(snap(p));subs.push(f);if(ready.v)setTimeout(f,0);return()=>{subs=subs.filter(x=>x!==f);};},
      collection:c=>col(p+'/'+c)};}
    function col(p){const n=p.split('/').length;const q=()=>{const docs=Object.keys(data).filter(k=>k.startsWith(p+'/')&&k.split('/').length===n+1).sort().map(snap);return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}};};
      return{path:p,doc:id=>doc(p+'/'+(id||rid())),get:async()=>q(),
        onSnapshot(nx){const f=()=>nx(q());subs.push(f);if(ready.v)setTimeout(f,0);return()=>{subs=subs.filter(x=>x!==f);};}};}
    return{db:{doc,collection:col},data,notify,setReady(){ready.v=true;notify();},isReady:()=>ready.v};
  }

  /* verbinden met de eerste berichtenserver die werkt; spelers gebruiken dezelfde als de spelleider */
  function connectBroker(startIdx,h){
    let idx=startIdx,everUp=false;
    function tryOne(){
      const url=BROKERS[idx%BROKERS.length];
      const client=mqtt.connect(url,{clientId:(IS_HOST?'h':'p')+rid(12),clean:true,keepalive:15,reconnectPeriod:2000,connectTimeout:7000,will:h.will?h.will():undefined});
      let up=false;
      const giveUp=setTimeout(()=>{if(!up&&!everUp&&IS_HOST&&!QS.get('broker')){try{client.end(true);}catch(e){}idx++;tryOne();}},9000);
      client.on('connect',()=>{up=true;everUp=true;clearTimeout(giveUp);h.connect(client,idx%BROKERS.length);});
      client.on('message',(t,m)=>h.message(t,m));
      client.on('close',()=>h.close&&h.close());
      client.on('offline',()=>h.close&&h.close());
      client.on('error',()=>{});
    }
    tryOne();
  }

  let store;
  if(IS_HOST){
    /* ---------- spelleider ---------- */
    NET.hostId=LS.get('okq-hostid2',null)||rid(14);LS.set('okq-hostid2',NET.hostId);
    NET.code=NET.hostId.slice(0,4).toUpperCase();
    NET.pid='host';
    const base='okq3/'+NET.hostId;
    let brokerIdx=0,client=null;
    const saved=LS.get('okq-data',{});
    const seen=new Map();let lastOnline='';
    let saveT=0;
    const persist=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{const d={};for(const k in store.data)if(k!=='quiz/bank')d[k]=store.data[k];LS.set('okq-data',d);},300);};
    const pubKey=(p,v)=>{if(client&&client.connected)client.publish(base+'/k/'+p,v==null?'':enc(v),{retain:true,qos:1});};
    const apply=(p,v)=>{if(v===null)delete store.data[p];else store.data[p]=v;persist();store.notify();
      if(PUBLIC(p))pubKey(p,v);
      if(p.startsWith('answers/')&&client&&client.connected)client.publish(base+'/a/'+p.slice(8),v==null?'':enc(v),{retain:true,qos:1});};
    store=makeStore(saved,async(p,v)=>apply(p,v));
    if(!store.data['game/state'])store.data['game/state']={phase:'lobby',seq:0,idx:-1,q:null,openedAt:0,reveal:null,scores:{},done:[]};
    store.setReady();
    NET.unlock=async pin=>{try{const E=window.__BANKENC,d=x=>Uint8Array.from(atob(x),ch=>ch.charCodeAt(0));
        const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(E.salt),iterations:150000,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},false,['decrypt']);
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(E.iv)},key,d(E.ct));
        store.data['quiz/bank']=JSON.parse(new TextDecoder().decode(pt));LS.set('okq-pin',pin);store.notify();return true;}catch(e){return false;}};
    if(LS.get('okq-pin',null))NET.unlock(LS.get('okq-pin',null));
    NET.onlinePids=()=>{const s=new Set(),now=Date.now();for(const [pid,o] of seen)if(!o.tv&&now-o.t<7000&&o.vis!==false)s.add(pid);return s;};
    const pulse=()=>{const s=[...NET.onlinePids()].sort().join(',');NET.peers=s?s.split(',').length:0;if(s!==lastOnline){lastOnline=s;NET.onchange();}};
    setInterval(()=>{pulse();if(client&&client.connected)client.publish(base+'/clock',enc({now:Date.now()}),{qos:0});},1000);
    connectBroker(0,{
      connect(c,idx){client=c;brokerIdx=idx;NET.status='online';
        c.subscribe(base+'/up/+',{qos:1});
        for(const k in store.data){if(PUBLIC(k))pubKey(k,store.data[k]);else if(k.startsWith('answers/'))c.publish(base+'/a/'+k.slice(8),enc(store.data[k]),{retain:true,qos:1});}
        NET.onchange();},
      close(){if(NET.status==='online'){NET.status='reconnecting';NET.onchange();}},
      message(t,m){
        const pid=t.split('/').pop();if(!/^[a-z0-9]{6,20}$/.test(pid))return;
        const msg=dec(m);if(!msg||typeof msg!=='object')return;
        if(msg.t==='hb'){seen.set(pid,{t:Date.now(),vis:msg.vis!==false,tv:!!msg.tv});pulse();return;}
        if(msg.t==='bye'){seen.delete(pid);pulse();return;}
        if(msg.t!=='write')return;
        const o=seen.get(pid);seen.set(pid,{t:Date.now(),vis:o?o.vis:true});
        const p=msg.p;let v=msg.v;
        if(p!=='players/'+pid&&p!=='answers/'+pid)return;
        if(v===null||typeof v!=='object'||enc(v).length>200000)return;
        if(p.startsWith('players/')){if(!store.data[p]&&Object.keys(store.data).filter(k=>k.startsWith('players/')).length>=24)return;
          v={name:String(v.name||'').slice(0,20),photo:typeof v.photo==='string'&&v.photo.startsWith('data:image/')?v.photo:undefined};if(!v.photo)delete v.photo;}
        if(p.startsWith('answers/'))v={seq:+v.seq,c:+v.c,ms:+v.ms};
        if(NET.validateWrite){v=NET.validateWrite(pid,p,v);if(v===undefined)return;}
        apply(p,v);
      }
    });
    NET.joinUrl=()=>{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('join',NET.hostId);if(brokerIdx)u.searchParams.set('b',String(brokerIdx));if(QS.get('broker'))u.searchParams.set('broker',QS.get('broker'));return u.toString();};
    NET.tvUrl=()=>{const u=new URL(NET.joinUrl());u.searchParams.set('tv','1');return u.toString();};
    NET.newGame=()=>{try{for(const k in store.data)if(PUBLIC(k))pubKey(k,null);}catch(e){}LS.set('okq-data',{});LS.set('okq-hostid2',null);setTimeout(()=>location.reload(),600);};
  }else{
    /* ---------- speler of tv-venster ---------- */
    NET.hostId=JOIN;NET.code=String(JOIN).slice(0,4).toUpperCase();
    if(NET.tv){NET.pid='tv'+rid(8);}else{NET.pid=LS.get('okq-pid',null)||rid(12);LS.set('okq-pid',NET.pid);}
    const base='okq3/'+JOIN;let client=null,lastClock=0,gotState=false;
    store=makeStore({},async(p,v)=>{
      if(!client||!client.connected)throw new Error('offline');
      client.publish(base+'/up/'+NET.pid,enc({t:'write',p,v}),{qos:1});
      if(v===null)delete store.data[p];else store.data[p]=v;store.notify();
    });
    const vis=()=>document.visibilityState==='visible';
    const hb=()=>{if(client&&client.connected&&!NET.tv)client.publish(base+'/up/'+NET.pid,enc({t:'hb',vis:vis()}),{qos:0});};
    const setStatus=s=>{if(NET.status!==s){NET.status=s;NET.onchange();}};
    const check=()=>{
      if(!client||!client.connected){setStatus(NET.status==='online'?'reconnecting':(NET.status==='nohost'?'nohost':'connecting'));return;}
      if(Date.now()-lastClock>6000){setStatus(gotState||lastClock?'reconnecting':'nohost');return;}
      if(gotState){if(!store.isReady())store.setReady();setStatus('online');}};
    let firstCheck=Date.now();
    setInterval(()=>{hb();if(Date.now()-firstCheck>3000)check();},2000);
    connectBroker(+(QS.get('b')||0),{
      will:()=>NET.tv?undefined:{topic:base+'/up/'+NET.pid,payload:enc({t:'bye'}),qos:1,retain:false},
      connect(c){client=c;c.subscribe([base+'/k/#',base+'/clock',base+'/a/'+NET.pid],{qos:1});hb();},
      close(){check();},
      message(t,m){
        if(t===base+'/clock'){const d=dec(m);if(d&&d.now){NET.offset=d.now-Date.now();lastClock=Date.now();check();}return;}
        let p;if(t.startsWith(base+'/k/'))p=t.slice(base.length+3);else if(t===base+'/a/'+NET.pid)p='answers/'+NET.pid;else return;
        const v=dec(m);if(v===undefined)return;
        if(v===null)delete store.data[p];else store.data[p]=v;
        if(p==='game/state')gotState=true;
        store.notify();
      }
    });
    document.addEventListener('visibilitychange',hb);
    addEventListener('pagehide',()=>{try{if(client&&client.connected&&!NET.tv)client.publish(base+'/up/'+NET.pid,enc({t:'hb',vis:false}),{qos:0});}catch(e){}});
    NET.joinUrl=()=>{const u=new URL(location.href);u.searchParams.delete('tv');return u.toString();};
  }
  const user={isOwner:async()=>IS_HOST,id:async()=>NET.tv?null:NET.pid,canEdit:async()=>IS_HOST,can:async()=>null};
  window.claude={use:async n=>n==='db'?store.db:n==='user'?user:null};
})();
</script>

<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEYLBL=['A','B','C','D'];

const S={db:null,user:null,uid:null,owner:false,state:null,stateLoaded:false,bank:null,players:{},answers:{},myAns:null,
  local:{seq:null,start:0,expired:false},view:'regie',controller:false,revealing:false,editing:false,resetArm:0,delArm:null,loadErr:''};

function defaultState(){return{phase:'lobby',seq:0,idx:-1,q:null,openedAt:0,reveal:null,scores:{},done:[]};}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3500);}
function wake(){try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}}

/* ---------- opstarten ---------- */
(async function init(){
  const loadTimer=setTimeout(()=>{if(!S.stateLoaded){S.loadErr='De quiz is nog niet bereikbaar. Controleer je verbinding; de pagina blijft het proberen.';render();}},10000);
  if(!window.claude?.use){renderNoAccess();return;}
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db){clearTimeout(loadTimer);renderNoAccess();return;}
  S.db=db;S.user=user;
  S.owner=user?await user.isOwner():false;
  S.uid=user?await user.id():null;
  const fail=()=>{S.loadErr='Verbinding met de quiz verbroken. Laad de pagina opnieuw.';render();};
  db.doc('game/state').onSnapshot(s=>{
    S.state=s.exists?s.data():null;
    if(!s.metadata.fromCache){S.stateLoaded=true;clearTimeout(loadTimer);S.loadErr='';}
    else S.stateLoaded=S.stateLoaded||!!S.state;
    onState();
  },fail);
  db.collection('players').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.players=m;render();if(S.owner)presence();},fail);
  if(S.owner){
    db.doc('quiz/bank').onSnapshot(s=>{S.bank=s.exists?s.data():null;render();},fail);
    db.collection('answers').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.answers=m;render();checkAuto();},fail);
  }else if(S.uid){
    db.doc('answers/'+S.uid).onSnapshot(s=>{S.myAns=s.exists?s.data():null;render();},()=>{});
  }
  render();
})();

function onState(){
  const st=S.state;
  if(st&&st.phase==='open'&&st.seq!==S.local.seq){S.local={seq:st.seq,start:performance.now(),expired:false};}
  render();
}

/* ---------- helpers ---------- */
const pageNo=i=>Math.max(0,i)+1;
const pname=id=>S.players[id]?.name||'Speler';
const playerIds=()=>Object.keys(S.players);
function elapsedAt(now){const st=S.state;if(!st?.q)return 0;const p=st.paused;return (p?Math.min(now,p.at):now)-st.openedAt-(st.pausedTotal||0);}
function remainingHost(){const st=S.state;if(!st?.q)return 0;return st.q.limit-elapsedAt(Date.now())/1000;}
function remainingPlayer(){const st=S.state;if(!st?.q)return 0;return st.q.limit-elapsedAt(Date.now()+(NET.offset||0))/1000;}
S.ignore=new Set();
function offlinePlayers(){if(!S.owner)return[];const on=NET.onlinePids();return playerIds().filter(id=>!id.startsWith('test-')&&!on.has(id)&&!S.ignore.has(id));}
let presBusy=false;
async function presence(){const st=S.state;if(!S.owner||!st||presBusy)return;
  const on=NET.onlinePids();for(const id of [...S.ignore])if(on.has(id))S.ignore.delete(id);
  const off=offlinePlayers();presBusy=true;
  try{
    if(st.phase==='open'){
      if(off.length&&(!st.paused||st.paused.resumeAt))await save({...st,paused:{at:st.paused?st.paused.at:Date.now(),who:off}});
      else if(st.paused&&!st.paused.resumeAt&&!off.length)await save({...st,paused:{...st.paused,who:[],resumeAt:Date.now()+3000}});
      else if(st.paused&&off.length&&st.paused.who.join()!==off.join())await save({...st,paused:{...st.paused,who:off}});
      else render();
    }else render();
  }finally{presBusy=false;}
}
NET.validateWrite=(pid,p,v)=>{
  if(!p.startsWith('answers/'))return v;
  const st=S.state;if(!st||st.phase!=='open'||st.paused||v.seq!==st.seq||!S.players[pid])return undefined;
  const prev=S.answers[pid];if(prev&&prev.seq===st.seq)return undefined;
  if(!(v.c>=0&&v.c<(st.q.options||[]).length))return undefined;
  const ms=Math.max(0,Math.round(elapsedAt(Date.now())));if(ms>st.q.limit*1000+800)return undefined;
  return {seq:st.seq,c:v.c,ms:Math.min(ms,st.q.limit*1000)};
};
const answeredMine=()=>S.myAns&&S.state&&S.myAns.seq===S.state.seq;
function ranking(){const sc=S.state?.scores||{};return playerIds().map(id=>({id,name:pname(id),pts:sc[id]||0})).sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name));}

function avatar(id,size,cls=''){const p=S.players[id]||{};const ini=esc((p.name||'?').trim().charAt(0).toUpperCase());
  return `<span class="av ${cls}" style="--s:${size}px">${p.photo?`<img src="${esc(p.photo)}" alt="">`:`<b>${ini}</b>`}<i class="hat" aria-hidden="true"></i></span>`;}
function scoreboard(withPlus){
  const gain=S.state?.reveal?.gain||{};const list=ranking();
  if(!list.length)return `<p class="muted">Nog niemand aangemeld.</p>`;
  return `<div class="teams">${list.map((p,i)=>`<div class="team ${p.id===S.uid?'me':''}"><span class="rank">${i+1}</span>${avatar(p.id,38)}<span class="nm">${esc(p.name)}${p.id===S.uid?' (jij)':''}</span>${withPlus&&gain[p.id]?`<span class="plus">+${gain[p.id]}</span>`:''}<span class="pts">${p.pts}</span></div>`).join('')}</div>`;
}

function qrBlock(big){
  let svg='';try{const q=qrcode(0,'M');q.addData(NET.joinUrl());q.make();svg=q.createSvgTag({cellSize:big?8:5,margin:2,scalable:true});}catch(e){svg='';}
  return `<div class="qr-wrap ${big?'tvqr':''}">${svg?`<div class="qr">${svg}</div>`:''}<div class="stack" style="gap:8px;min-width:0">
    <h2>Doe mee</h2><p style="margin:0">Scan de code met de camera van je telefoon en vul je naam in.</p><p class="muted" style="margin:0;font-size:13px;letter-spacing:.2em">SPELCODE <b style="color:var(--gold-hi)">${NET.code}</b></p>
    <p class="muted" style="margin:0;font-size:13px;word-break:break-all">${NET.joinUrl()}</p>
    ${big?'':`<div class="netstat ${NET.status==='online'?'':'off'}"><i></i><span>${NET.status==='online'?`Online · ${NET.peers} verbonden`:'Verbinden met de server…'}</span></div><div><button class="btn sm ghost" data-act="copy">Link kopiëren</button></div>`}</div></div>`;
}

/* ---------- verbindingsstatus ---------- */
NET.onchange=()=>{if(S.owner)presence();else if(!S.state)render();const el=$('#netbar');const m={connecting:'Verbinden met de spelleider…',nohost:'De spelleider is nog niet online. We blijven het proberen…',reconnecting:'Verbinding kwijt. Opnieuw verbinden…',waiting:'Quiz wordt opgestart…'};
  if(el){el.hidden=NET.status==='online'||(!NET.host&&!S.state);el.textContent=m[NET.status]||'';}
  if(S.owner&&S.view==='regie'){const n=document.querySelector('.netstat');if(n){n.classList.toggle('off',NET.status!=='online');n.querySelector('span').textContent=NET.status==='online'?`Online · ${NET.peers} verbonden`:'Verbinden met de server…';}}};
/* ---------- render ---------- */
function render(){
  $('#wrap').classList.toggle('wide',S.owner||NET.tv);
  document.body.classList.toggle('tv',S.owner&&S.view==='tv');
  document.body.classList.toggle('playing',!!S.state&&(['open','task','reveal'].includes(S.state.phase)||(S.state.phase==='end'&&((S.owner&&S.view==='tv')||NET.tv)))&&!(S.owner&&S.view==='regie'));
  if(!NET.host&&!NET.tv&&!S.state){const nb=$('#netbar');if(nb)nb.hidden=true;
    app.innerHTML=NET.status==='nohost'?`<div class="panel"><h2>Wachten op de spelleider</h2><p style="margin:0">De quiz staat nog niet open bij de spelleider. Zodra die online is, verbind je vanzelf. Je hoeft niets te doen.</p><p class="muted" style="margin:0;font-size:13px;letter-spacing:.2em">SPELCODE <b style="color:var(--gold-hi)">${NET.code}</b>, moet gelijk zijn aan de code bij de spelleider</p></div>`:`<p class="searching">Verbinden met de spelleider…</p>`;return;}
  if(S.loadErr&&!S.state){app.innerHTML=`<p class="notice">${esc(S.loadErr)}</p>`;return;}
  if(!S.db)return;
  if(S.owner){renderHost();return;}
  if(NET.tv){document.body.classList.add('tv');app.innerHTML=(document.fullscreenElement?'':`<div class="row" style="justify-content:flex-end"><button class="btn sm ghost" data-act="fs">Volledig scherm</button></div>`)+(S.state?renderPublic(true):'<p class="searching">Verbinden met de spelleider…</p>');fx(S.state?.phase==='end');return;}
  if(!S.uid){renderNoAccess();return;}
  if(!S.stateLoaded&&!S.state){app.innerHTML=`<p class="searching">Even laden…</p>`;return;}
  if(!S.state){app.innerHTML=`<div class="panel"><h2>Nog even geduld</h2><p>De spelleider zet de quiz klaar. Deze pagina ververst vanzelf.</p></div>`;return;}
  const me=S.players[S.uid];
  if(!me||S.editing){renderJoin(me);return;}
  if(!me.photo||S.retake){renderSelfie(me);return;}
  app.innerHTML=renderPublic(false);
  fx(S.state.phase==='end');
}

const pick=(arr,n)=>arr[Math.abs(n|0)%arr.length];
const fill=(t,o)=>t.replace(/\{(\w+)\}/g,(m,k)=>o[k]??'');
const LINES={
  all:["Iedereen goed! Te makkelijk, of zijn jullie gewoon een stel slimmeriken?","Allemaal raak. De spelleider gaat de vragen moeilijker maken, let maar op.","Iedereen goed. Dit voelt als een groepsopdracht waar iedereen meewerkte."],
  none:["Niemand had het goed. Was dit een strikvraag? Nee hoor.","Nul goede antwoorden. De 00s zijn duidelijk langer geleden dan jullie dachten.","Helemaal niemand? Zelfs de testspelers schamen zich."],
  lead:["Wisseling aan kop! {name} grijpt de macht.","{name} staat ineens bovenaan. Iedereen: pak 'm!","Nieuwe koploper: {name}. Zet het maar op je Hyves."],
  hot:["{name} heeft er {n} op rij goed. Iemand heeft vroeger te veel Wikipedia gelezen.","{n} keer raak voor {name}. Zelfs Google is onder de indruk.","{name}: {n} op rij. Dit is geen geluk meer, dit is talent."],
  cold:["{name} zit op {n} keer mis op rij. Tijd om de Nokia te herstarten.","{n} keer fout voor {name}. Was je in de 00s soms in slaap gevallen?","{name} heeft er {n} op rij naast. Zelfs de millenniumbug deed het beter."],
  fast:["{name} drukte sneller dan je 'MSN-por' kon zeggen.","{name} was er sneller bij dan een sms op een Nokia 3310.","{name} had het antwoord al voordat de vraag uit was. Verdacht snel."],
  meHot:["{n} op rij goed. Rustig aan, laat de anderen ook eens wat.","{n} keer raak! Je bent officieel de Federer van deze quiz.","{n} op rij. Wie heeft jou ingehuurd?"],
  meCold:["{n} keer mis op rij. Gelukkig telt gezelligheid ook.","{n} op rij fout. Je oliebol gelooft nog in je.","Oei, {n} keer naast. Misschien die champagne even wegzetten?"],
  meGood:["Goed zo! Snel én slim.","Raak! Je jongere ik zou trots zijn.","Netjes. Respect, zoals ze op Hyves zeiden."],
  meBad:["Bijna. Of nou ja, niet echt.","Fout, maar wel met overtuiging gekozen.","Nope. Volgende vraag gaat vast beter."],
  meNone:["Geen antwoord? Was je even een oliebol aan het halen?","Te laat! Je tikte als een inbelmodem.","Zzz. Niet in slaap vallen voor 12 uur!"]
};
function commentary(st){
  const rv=st.reveal||{};const ans=rv.answers||{};const ids=playerIds();const seq=st.seq||0;
  if(!ids.length||st.q?.test)return '';
  const good=ids.filter(id=>ans[id]&&ans[id].c===rv.correct);
  if(rv.leaderChange&&S.players[rv.leaderChange])return fill(pick(LINES.lead,seq),{name:pname(rv.leaderChange)});
  if(good.length===ids.length&&ids.length>1)return pick(LINES.all,seq);
  if(!good.length)return pick(LINES.none,seq);
  const sk=st.streak||{};
  const hot=ids.filter(id=>(sk[id]||0)>=3).sort((a,b)=>sk[b]-sk[a])[0];
  const cold=ids.filter(id=>(sk[id]||0)<=-3).sort((a,b)=>sk[a]-sk[b])[0];
  if(hot&&(seq%2||!cold))return fill(pick(LINES.hot,seq),{name:pname(hot),n:sk[hot]});
  if(cold)return fill(pick(LINES.cold,seq),{name:pname(cold),n:-sk[cold]});
  const f=good.sort((a,b)=>ans[a].ms-ans[b].ms)[0];
  return fill(pick(LINES.fast,seq),{name:pname(f)});
}
function personal(st){
  const rv=st.reveal||{};const my=rv.answers?.[S.uid];const n=st.streak?.[S.uid]||0;const seq=st.seq||0;
  if(n>=3)return fill(pick(LINES.meHot,seq),{n});
  if(n<=-3)return fill(pick(LINES.meCold,seq),{n:-n});
  if(!my)return pick(LINES.meNone,seq);
  return pick(my.c===rv.correct?LINES.meGood:LINES.meBad,seq);
}
const nl=n=>Number(n||0).toLocaleString('nl-NL');
function resultCard(st,kind,gain){
  const list=ranking();const i=list.findIndex(p=>p.id===S.uid);if(i<0)return '';
  const me=list[i],lead=list[0],n=list.length;
  const per=Math.round(750*(st.q?.mult||1));
  let chase='';
  if(i===0){const nx=list[1];chase=nx?`Jij bent <b>koploper</b>! Voorsprong: <b>${nl(me.pts-nx.pts)}</b> punten op ${esc(nx.name)}.`:'Jij bent <b>koploper</b>!';}
  else{const up=list[i-1];const gap=up.pts-me.pts+1;const need=Math.max(1,Math.ceil(gap/per));
    chase=`Nog <b>${nl(gap)}</b> punten om ${esc(up.name)} (${i}e) in te halen. Dat is ongeveer <b>${need}</b> goed${need===1?' antwoord':'e antwoorden'}.`;}
  const corr=st.corr?.[S.uid]||0,qc=st.qcount||0;
  const verdict={ok:'Goed!',bad:'Fout',none:'Te laat',task:'Punten!'}[kind];
  return `<div class="result ${kind}">
    <div class="verdict">${verdict}</div>
    ${gain>0?`<div class="gainbig">+${nl(gain)}</div>`:`<div class="gainbig zero">+0</div>`}
    <div class="rankline">Je staat <b>${i+1}e</b> van ${n} · <b>${nl(me.pts)}</b> punten</div>
    <div class="chase">${chase}</div>
    <div class="facts"><span>Koploper: <b>${esc(lead.name)}</b> · ${nl(lead.pts)}</span>${qc?`<span>${corr} van ${qc} goed</span>`:''}</div>
  </div>`;
}
function revealFaces(rv){
  const ans=rv.answers||{};const gain=rv.gain||{};
  const good=Object.keys(ans).filter(id=>ans[id].c===rv.correct&&S.players[id]).sort((a,b)=>ans[a].ms-ans[b].ms);
  const bad=Object.keys(ans).filter(id=>ans[id].c!==rv.correct&&S.players[id]);
  const none=playerIds().filter(id=>!ans[id]);
  let h='';
  if(good.length){const f=good[0];h+=`<div class="fastest">${avatar(f,110,'party wobble')}<div class="stack" style="gap:2px;min-width:0"><span class="label">Snelste vinger</span><span class="mine">${esc(pname(f))}</span><span class="muted">${(ans[f].ms/1000).toFixed(1)} sec${gain[f]?` · +${gain[f]}`:''}</span></div></div>`;}

let faceDet=null;
async function getDetector(){
  if(faceDet)return faceDet;
  const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const m=await import(V+'/vision_bundle.mjs');
  const files=await m.FilesetResolver.forVisionTasks(V+'/wasm');
  faceDet=await m.FaceDetector.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},runningMode:'IMAGE',minDetectionConfidence:.45});

function withTimeout(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);}

    if(k.length<4)return null;

}

async function loadRaw(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
    const sc=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight));
    const full=document.createElement('canvas');full.width=Math.round(img.naturalWidth*sc);full.height=Math.round(img.naturalHeight*sc);
    full.getContext('2d').drawImage(img,0,0,full.width,full.height);
    S.detect='busy';S.face=null;render();
    const f=await findFace(full);
    let cx=full.width/2,cy=full.height/2,side=Math.min(full.width,full.height);
    if(f){const ex=(f.eyes[0].x+f.eyes[1].x)/2,ey=(f.eyes[0].y+f.eyes[1].y)/2,ed=Math.hypot(f.eyes[1].x-f.eyes[0].x,f.eyes[1].y-f.eyes[0].y);

function faceFrom(e1,e2,nose,mouth){

  const d=Math.max(20,Math.hypot(R.x-L.x,R.y-L.y)),a=Math.atan2(R.y-L.y,R.x-L.x);

/* filters met eigen pixelbewerking: werkt ook op iPhone */
function applyFilter(x,n,kind){
  if(kind==='orig')return;
  const im=x.getImageData(0,0,n,n),d=im.data;
  const C=(v,c)=>(v-128)*c+128;
  for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];
    if(kind==='goud'){const R=.393*r+.769*g+.189*b,G=.349*r+.686*g+.168*b,B=.272*r+.534*g+.131*b;
      r=r*.45+R*.55;g=g*.45+G*.55;b=b*.45+B*.55;r=C(r*1.08,1.08);g=C(g*1.02,1.08);b=C(b*.88,1.08);}
    else if(kind==='pop'){const l=.299*r+.587*g+.114*b;r=l+(r-l)*1.9;g=l+(g-l)*1.9;b=l+(b-l)*1.9;r=C(r*1.04,1.18);g=C(g,1.18);b=C(b*1.08,1.18);}
    else if(kind==='glam'){const l=.299*r+.587*g+.114*b;r=g=b=C(l*1.05,1.3);}

  const tabs=`<div class="tabs"><button class="btn ${S.view==='regie'?'':'ghost'}" data-act="view" data-v="regie">Regie</button><button class="btn ${S.view==='tv'?'':'ghost'}" data-act="view" data-v="tv">TV-scherm</button><button class="btn ghost" data-act="tvwin" title="Opent het tv-scherm in een eigen venster voor je tweede scherm">TV-venster openen</button></div>`;
  if(!S.stateLoaded&&!st){app.innerHTML=`<p class="searching">Even laden…</p>`;return;}
  if(!S.bank){app.innerHTML=`<form class="panel" id="pinform" style="max-width:460px"><h2>Spelleiderscode</h2><p style="margin:0">De vragen zijn versleuteld. Vul de spelleiderscode in om de quiz te openen. Ben je speler? Scan dan de QR-code op het tv-scherm.</p><label class="label" for="pin">Code</label><input type="text" id="pin" autocomplete="off" autocapitalize="off"><button class="btn" type="submit">Quiz openen</button></form>`;return;}
  if(!st){app.innerHTML=`<div class="panel"><h2>Spel klaarzetten</h2><p>Er staat nog geen spel klaar.</p><div><button class="btn" data-act="setup">Zet spel klaar</button></div></div>`;return;}
  if(S.view==='tv'){app.innerHTML=tabs+renderPublic(true);fx(st.phase==='end');return;}
  fx(false);
  const bank=S.bank?.items||[];const it=bank[st.idx];const ids=playerIds();
  const off=offlinePlayers();
  const hold=off.length?`<div class="pausebox"><span class="label">${st.phase==='open'?'Spel gepauzeerd':'Even wachten'}</span><p>Geen verbinding met ${off.map(id=>esc(pname(id))).join(', ')}. ${st.phase==='open'?'De tijd staat stil tot iedereen terug is.':'Starten kan zodra iedereen terug is.'}</p><div class="row" style="justify-content:center"><button class="btn sm ghost" data-act="ignoreoff">Toch doorgaan zonder ${off.length===1?esc(pname(off[0])):'hen'}</button></div></div>`:'';
  let now='';
  if(st.phase==='lobby')now=`<p style="margin:0">Het wachtscherm met de QR-code staat aan. Start de eerste vraag zodra iedereen erin zit.</p><div class="row"><button class="btn" data-act="release" data-i="${nextIdx()}" ${bank.length?'':'disabled'}>Start vraag ${pageNo(nextIdx())}</button></div>`;
  else if(st.phase==='open'&&it){
    const n=ids.filter(id=>S.answers[id]?.seq===st.seq).length;
    now=`${itemHead(it)}
      ${it.host?`<p class="notice">${esc(it.host)}</p>`:''}
      ${it.song&&S.bank.items[st.idx-1]?.type!=='music'?`<p class="notice" style="font-size:14px">Muziekronde: zet de Quiz-playlist aan bij nummer 1. Na elke vraag start de volgende vanzelf; jij tikt alleen op 'volgend nummer' op je vergrendelscherm.</p>`:''}
      ${it.song?`<div class="row">${spotify(it)}<a class="btn spot" href="https://open.spotify.com/playlist/2gNIM9KsqBtqbeJHdB1jOD" target="_blank" rel="noopener">Quiz-playlist</a><span class="muted" style="font-size:13px">Tip: zet het nummer klaar vóór je de vraag start.</span></div>`:''}
      <p class="ans">Goed: ${KEYLBL[it.correct]} · ${esc(it.options[it.correct])}</p>
      <div class="timer-row"><span>Nog</span><b data-timer="host">${Math.max(0,Math.ceil(remainingHost()))}</b></div>
      <div class="timer"><i data-bar="host" style="width:${Math.max(0,remainingHost()/st.q.limit*100)}%"></i></div>
      <div class="counts"><span>${n} van ${ids.length} hebben geantwoord</span></div>
      <div class="row"><button class="btn" data-act="reveal">Stop en toon antwoord</button></div>
      <p class="muted" style="font-size:12px;margin:0">Het antwoord verschijnt vanzelf zodra iedereen heeft gekozen of de tijd om is.</p>`;
  }else if(st.phase==='task'&&it){
    const g=st.reveal?.gain||{};
    now=`${itemHead(it)}${it.host?`<p class="notice">${esc(it.host)}</p>`:''}
      <span class="label">Punten geven</span>
      ${ids.length?ids.map(id=>`<div class="row"><span class="team" style="flex:1;min-width:150px"><span class="nm">${esc(pname(id))}</span><span class="plus">+${g[id]||0}</span></span>
        <button class="btn sm" data-act="award" data-u="${id}" data-p="${Math.round(250*(st.q?.mult||1))}">+${Math.round(250*(st.q?.mult||1))}</button><button class="btn sm" data-act="award" data-u="${id}" data-p="${Math.round(500*(st.q?.mult||1))}">+${Math.round(500*(st.q?.mult||1))}</button><button class="btn sm" data-act="award" data-u="${id}" data-p="${Math.round(1000*(st.q?.mult||1))}">+${Math.round(1000*(st.q?.mult||1))}</button><button class="btn sm ghost" data-act="award" data-u="${id}" data-p="${-Math.round(250*(st.q?.mult||1))}">−${Math.round(250*(st.q?.mult||1))}</button></div>`).join(''):'<p class="muted">Nog geen spelers.</p>'}
      <div class="row"><button class="btn" data-act="taskdone">Opdracht afronden</button></div>`;
  }else if(st.phase==='reveal'){
    const ni=nextIdx();
    const an=S.autoNext;
    now=`${it?itemHead(it):''}<p style="margin:0">Het antwoord en de stand staan op alle telefoons.</p>${commentary(st)?`<div class="commentator"><span class="label">De commentator</span><p>${esc(commentary(st))}</p></div>`:''}
      ${an?`<div class="autonext"><p style="margin:0"><b>Skip nu naar het volgende nummer.</b> De volgende muziekvraag start over <b data-auto>${Math.max(0,Math.ceil((an.at-Date.now())/1000))}</b> seconden.</p><div class="row"><button class="btn sm" data-act="release" data-i="${an.idx}">Nu starten</button><button class="btn sm ghost" data-act="pauseauto">Pauzeer</button></div></div>`:''}
      <div class="row">${ni<bank.length?`<button class="btn" data-act="release" data-i="${ni}">Volgende: vraag ${pageNo(ni)}</button>`:''}<button class="btn ghost" data-act="lobby">Wachtscherm</button><button class="btn ghost" data-act="end">Eindstand tonen</button></div>`;
  }else if(st.phase==='end'){
    now=`<p style="margin:0">De eindstand staat op alle telefoons.</p><div class="row"><button class="btn ghost" data-act="lobby">Terug naar wachtscherm</button></div>`;
  }
  let rounds='',last='';
  bank.forEach((q,i)=>{if(q.round!==last){rounds+=`<div class="rh">${esc(q.round)}</div>`;last=q.round;}
    const done=(st.done||[]).includes(i);
    rounds+=`<div class="qi ${i===st.idx&&st.phase!=='lobby'?'cur':''} ${done?'done':''}"><span class="p">${pageNo(i)}</span><span class="t"><span class="ty">${q.test?'oefen':q.type==='mc'?'vraag':q.type==='music'?'muziek':'opdracht'}${q.mult>1?' · '+multTxt(q.mult):''}${done?' · gespeeld':''}</span><br>${esc(q.text)}</span><span class="row" style="gap:6px;justify-content:flex-end">${spotify(q,true)}<button class="btn sm ${done?'ghost':''}" data-act="release" data-i="${i}">Start</button></span></div>`;});
  const sc=st.scores||{};
  app.innerHTML=`${tabs}<div class="grid2">
    <div class="stack">
      <div class="panel"><span class="label">Nu op de telefoons · ${phaseName(st.phase)}</span>${hold}${now}</div>
      <div class="panel">${qrBlock(false)}</div>
      <div class="panel"><span class="label">Spelers · ${ids.length} aangemeld</span>
        ${ids.length?`<div class="teams">${ranking().map(p=>`<div class="team">${avatar(p.id,34)}<span class="nm">${esc(p.name)}</span><span class="pts">${p.pts}</span><button class="btn sm ${S.delArm===p.id?'r':'ghost'}" data-act="del" data-u="${p.id}">${S.delArm===p.id?'Zeker?':'Verwijder'}</button></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Nog niemand. Laat de QR-code scannen.</p>'}
      </div>
      <div class="panel"><span class="label">Alleen testen</span>
        <p style="margin:0;font-size:14px">Testspelers geven vanzelf antwoord, meestal goed, zodat je de hele quiz alleen kunt doorlopen. Kijk op het tabblad TV-scherm wat de spelers zien.</p>
        <div class="row">${hasBots()?`<button class="btn sm ghost" data-act="botsoff">Testspelers verwijderen</button>`:`<button class="btn sm" data-act="botson">Voeg 3 testspelers toe</button>`}</div></div>
      <div class="panel"><span class="label">Spel</span><div class="row"><button class="btn ghost sm" data-act="lobby">Wachtscherm</button><button class="btn ghost sm" data-act="end">Eindstand</button><button class="btn sm ${S.newArm>Date.now()?'r':'ghost'}" data-act="newgame">${S.newArm>Date.now()?'Klik nogmaals: alles wissen':'Nieuw spel'}</button><button class="btn sm ${S.resetArm>Date.now()?'r':'ghost'}" data-act="reset">${S.resetArm>Date.now()?'Klik nogmaals: alles op 0':'Scores resetten'}</button></div></div>
    </div>
    <div class="panel"><span class="label">Vragenlijst · ${bank.length} onderdelen</span>${bank.length?`<div class="qlist">${rounds}</div>`:'<p class="muted">De vragen worden geladen…</p>'}</div>
  </div>`;
}
function spotify(it,sm){return it.song?`<a class="btn ${sm?'sm':''} spot" href="https://open.spotify.com/search/${encodeURIComponent(it.song)}" target="_blank" rel="noopener">Open in Spotify</a>`:'';}
const multTxt=m=>'×'+String(m||1).replace('.',',');
function multBadge(m){return (m||1)>1?`<span class="mult">${multTxt(m)} punten</span>`:'';}
function itemHead(it){return `<span class="round">${esc(it.round)}</span>${multBadge(it.mult)}<p class="q-text" style="font-size:30px">${esc(it.text)}</p>`;}
function phaseName(p){return({lobby:'wachtscherm',open:'vraag loopt',task:'opdracht',reveal:'antwoord getoond',end:'eindstand'})[p]||p;}
function nextIdx(){const st=S.state;const bank=S.bank?.items||[];const done=st?.done||[];
  for(let i=Math.max(0,st?.idx??0);i<bank.length;i++)if(!done.includes(i))return i;
  for(let i=0;i<bank.length;i++)if(!done.includes(i))return i;return bank.length;}

async function save(next){
  S.state=next;render();
  try{await S.db.doc('game/state').set(next);}catch(e){toast('Opslaan mislukt. Probeer het opnieuw.');}
}
const BOTS=[['test-anna','Test Anna'],['test-bram','Test Bram'],['test-kim','Test Kim']];
const hasBots=()=>BOTS.some(([id])=>S.players[id]);
async function addBots(){try{for(const [id,name] of BOTS)await S.db.doc('players/'+id).set({name,test:true});toast('3 testspelers toegevoegd.');}catch(e){toast('Testspelers toevoegen mislukt.');}}
async function removeBots(){try{for(const [id] of BOTS){await S.db.doc('players/'+id).delete();await S.db.doc('answers/'+id).delete();}
  const sc={...(S.state.scores||{})};BOTS.forEach(([id])=>delete sc[id]);await save({...S.state,scores:sc});toast('Testspelers verwijderd.');}catch(e){toast('Verwijderen mislukt.');}}
function runBots(seq,it){
  if(!it||it.type==='task')return;const lim=(it.limit||20)*1000;
  BOTS.forEach(([id])=>{if(!S.players[id])return;
    const ms=Math.round(1500+Math.random()*lim*.6);
    const c=Math.random()<.65?it.correct:Math.floor(Math.random()*it.options.length);
    setTimeout(()=>{if(S.state?.seq===seq&&S.state.phase==='open')S.db.doc('answers/'+id).set({seq,c,ms}).catch(()=>{});},ms);});
}
async function release(i){
  S.autoNext=null;
  const it=S.bank?.items?.[i];if(!it)return;const st=S.state;
  const q={type:it.type,round:it.round,text:it.text,options:it.options||[],limit:it.limit||20,mult:it.mult||1,task:it.type==='task',test:!!it.test};
  S.controller=true;
  await save({...st,phase:it.type==='task'?'task':'open',idx:i,seq:(st.seq||0)+1,q,openedAt:Date.now(),pausedTotal:0,paused:null,reveal:it.type==='task'?{gain:{}}:null});
  runBots(S.state.seq,it);
}
async function reveal(){
  const st=S.state;if(S.revealing||st?.phase!=='open')return;const it=S.bank?.items?.[st.idx];if(!it)return;
  S.revealing=true;
  const answers={},gain={},scores={...(st.scores||{})};
  for(const id of playerIds()){const a=S.answers[id];
    if(a&&a.seq===st.seq){answers[id]={c:a.c,ms:a.ms};
      if(a.c===it.correct&&!it.test){const p=Math.round((500+500*Math.max(0,1-a.ms/(st.q.limit*1000)))*(st.q.mult||1));gain[id]=p;scores[id]=(scores[id]||0)+p;}}}
  const streak={...(st.streak||{})};let leaderChange=null;
  if(!it.test){for(const id of playerIds()){const ok=answers[id]&&answers[id].c===it.correct;const v=streak[id]||0;streak[id]=ok?Math.max(0,v)+1:Math.min(0,v)-1;}
    const top=Object.entries(scores).filter(([id])=>S.players[id]).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>0&&st.leader&&top[0]!==st.leader)leaderChange=top[0];
    var leader=top&&top[1]>0?top[0]:(st.leader||null);}
  const corr={...(st.corr||{})};if(!it.test)for(const id of playerIds()){if(answers[id]&&answers[id].c===it.correct)corr[id]=(corr[id]||0)+1;}
  const qcount=(st.qcount||0)+(it.test?0:1);
  await save({...st,phase:'reveal',reveal:{correct:it.correct,answers,gain,leaderChange},scores,streak,corr,qcount,leader:leader??st.leader??null,done:[...new Set([...(st.done||[]),st.idx])]});
  S.revealing=false;
  const nx=S.bank.items[st.idx+1];
  if(it.type==='music'&&nx&&nx.type==='music'){S.autoNext={at:Date.now()+8000,idx:st.idx+1};render();}
}
function checkAuto(){
  const st=S.state;if(!S.owner||st?.phase!=='open'||st.paused)return;
  const ids=playerIds().filter(id=>!S.ignore.has(id));const allIn=ids.length>0&&ids.every(id=>S.answers[id]?.seq===st.seq);
  if(allIn||remainingHost()<-1.5)reveal();
}
async function award(uid,p){
  const st=S.state;if(st.phase!=='task')return;
  const gain={...(st.reveal?.gain||{})};gain[uid]=(gain[uid]||0)+p;
  const scores={...(st.scores||{})};scores[uid]=(scores[uid]||0)+p;
  await save({...st,reveal:{gain},scores});
}

/* ---------- events ---------- */
document.addEventListener('submit',async e=>{
  if(e.target.id==='pinform'){e.preventDefault();const ok=await NET.unlock(($('#pin')?.value||'').trim());if(!ok)toast('Onjuiste code. Probeer het opnieuw.');return;}
  if(e.target.id!=='joinform')return;e.preventDefault();
  const name=($('#nm')?.value||'').trim();if(!name){toast('Vul je naam in.');return;}
  wake();
  try{const cur=S.players[S.uid]||{};await S.db.doc('players/'+S.uid).set({...cur,name});S.editing=false;render();}
  catch(err){toast('Geen verbinding met de spelleider. Probeer het zo nog een keer.');}
});
document.addEventListener('click',async e=>{
  if(S.owner)wake();
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const st=S.state;
  if(a==='ans'){wake();const i=+b.dataset.i;const ms=Math.max(0,Math.round(elapsedAt(Date.now()+(NET.offset||0))));
    if(!st||st.phase!=='open'||st.paused||answeredMine()||remainingPlayer()<=0)return;
    S.myAns={seq:st.seq,c:i,ms};render();
    try{await S.db.doc('answers/'+S.uid).set({seq:st.seq,c:i,ms});}catch(err){S.myAns=null;toast('Antwoord niet verstuurd. Tik nog een keer.');render();}
  }
  else if(a==='pauseauto'){S.autoNext=null;render();}
  else if(a==='newgame'){if(S.newArm>Date.now()){NET.newGame();}else{S.newArm=Date.now()+4000;render();setTimeout(render,4100);}}
  else if(a==='tvwin'){const w=window.open(NET.tvUrl(),'okq-tv','popup=yes,width=1280,height=720');if(!w)toast('Je browser blokkeert het venster. Sta pop-ups toe voor deze site.');}
  else if(a==='fs'){try{await document.documentElement.requestFullscreen();}catch(err){toast('Druk op F11 voor volledig scherm.');}render();}
  else if(a==='botson'){await addBots();}
  else if(a==='botsoff'){await removeBots();}
  else if(a==='edit'){S.editing=true;render();}
  else if(a==='retake'){S.retake=true;S.shot=null;S.raw=null;render();}
  else if(a==='canceledit'){S.editing=false;S.retake=false;S.shot=null;render();}
  else if(a==='tapeyes'){S.tap=[];S.tapPreview=tapPreview();render();}
  else if(a==='tapcancel'){S.tap=null;render();}
  else if(a==='fxf'){S.fx.f=b.dataset.k;await recompose();}
  else if(a==='fxp'){const k=b.dataset.k;S.fx.props=S.fx.props.includes(k)?S.fx.props.filter(z=>z!==k):[...S.fx.props,k];await recompose();}
  else if(a==='usephoto'){const photo=S.shot;if(!photo)return;
    try{await S.db.doc('players/'+S.uid).set({...(S.players[S.uid]||{}),photo});S.shot=null;S.raw=null;S.retake=false;render();toast('Lekker ding. Je doet mee!');}
    catch(err){toast('Foto opslaan mislukt. Probeer het opnieuw.');}}
  else if(a==='copy'){try{await navigator.clipboard.writeText(NET.joinUrl());toast('Link gekopieerd.');}catch(err){toast('Kopiëren lukt hier niet. Selecteer de link onder de code.');}}
  else if(a==='view'){S.view=b.dataset.v;render();}
  else if(a==='setup'){await save(defaultState());}
  else if(a==='release'){if(offlinePlayers().length){toast('Wacht tot iedereen weer verbonden is, of kies Toch doorgaan.');return;}await release(+b.dataset.i);}
  else if(a==='ignoreoff'){offlinePlayers().forEach(id=>S.ignore.add(id));await presence();}
  else if(a==='unlock'){}
  else if(a==='reveal'){S.controller=true;await reveal();}
  else if(a==='award'){await award(b.dataset.u,+b.dataset.p);}
  else if(a==='taskdone'){await save({...st,phase:'reveal',reveal:{gain:st.reveal?.gain||{}},done:[...new Set([...(st.done||[]),st.idx])]});}
  else if(a==='lobby'){await save({...st,phase:'lobby',reveal:null});}
  else if(a==='end'){await save({...st,phase:'end'});}
  else if(a==='del'){const u=b.dataset.u;
    if(S.delArm===u){S.delArm=null;try{await S.db.doc('players/'+u).delete();}catch(err){toast('Verwijderen mislukt.');}
      const sc={...(st.scores||{})};delete sc[u];await save({...st,scores:sc});}
    else{S.delArm=u;render();setTimeout(()=>{if(S.delArm===u){S.delArm=null;render();}},4000);}}
  else if(a==='reset'){if(S.resetArm>Date.now()){S.resetArm=0;await save({...st,phase:'lobby',scores:{},streak:{},corr:{},qcount:0,leader:null,reveal:null,done:[],idx:-1});}
    else{S.resetArm=Date.now()+4000;render();setTimeout(render,4100);}}
});

/* ---------- timers ---------- */
setInterval(()=>{
  const an=S.autoNext;
  const pz=S.state?.paused;
  if(S.owner&&pz?.resumeAt&&Date.now()>=pz.resumeAt){const st0=S.state;save({...st0,pausedTotal:(st0.pausedTotal||0)+(pz.resumeAt-pz.at),paused:null});}
  {const el=document.querySelector('[data-resume]');if(el&&pz?.resumeAt)el.textContent=Math.max(1,Math.ceil((pz.resumeAt-(Date.now()+(S.owner?0:(NET.offset||0))))/1000));}
  if(an&&S.owner){if(S.state?.phase!=='reveal'){S.autoNext=null;}else if(offlinePlayers().length){an.at=Date.now()+8000;}else if(Date.now()>=an.at){release(an.idx);}else{const el=document.querySelector('[data-auto]');if(el)el.textContent=Math.max(0,Math.ceil((an.at-Date.now())/1000));}}
  const st=S.state;if(st?.phase!=='open'||!st.q)return;
  document.querySelectorAll('[data-timer]').forEach(el=>{const r=el.dataset.timer==='host'?remainingHost():remainingPlayer();el.textContent=Math.max(0,Math.ceil(r));});
  document.querySelectorAll('[data-bar]').forEach(el=>{const r=el.dataset.bar==='host'?remainingHost():remainingPlayer();el.style.width=Math.max(0,r/st.q.limit*100)+'%';});
  if(!S.owner&&!S.local.expired&&remainingPlayer()<=0){S.local.expired=true;render();}
  checkAuto();
},200);

/* ---------- vuurwerk ---------- */
const FW=(()=>{
  const c=$('#fx'),ctx=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GOLD=['#fff4cc','#ffd76a','#f4b43c','#ffe7a3','#ffffff','#f0c060'];
  const TT=['#ff3a3a','#35e266','#36e6ff','#ff4ef0','#ffe41f'];
  let P=[],run=false,W=0,H=0,endMode=false,amb=false,lastAuto=0;
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
  size();addEventListener('resize',size);
  function burst(x,y,scale=1,pal){
    pal=pal||(Math.random()<.72?GOLD:TT);
    const n=Math.round(90*scale),ring=Math.random()<.4;
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(ring?3.2:1+Math.random()*3.4)*scale*(H>700?1.25:1);
      P.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+Math.random()*50,ml:110,c:pal[Math.random()*pal.length|0],w:1+Math.random()*1.6,tw:Math.random()<.35});}
    for(let i=0;i<14*scale;i++)P.push({x,y,px:x,py:y,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,l:30,ml:30,c:'#fff',w:3,tw:false});
  }
  function rocket(){
    const x=W*(.12+Math.random()*.76);
    P.push({rk:true,x,y:H+10,px:x,py:H+10,vx:(Math.random()-.5)*1.2,vy:-(H*.016+Math.random()*H*.006),ty:H*(.12+Math.random()*.32),c:'#ffe7a3',l:999,ml:999,w:2});
  }
  function step(t){
    if(endMode&&t-lastAuto>420){lastAuto=t;rocket();if(Math.random()<.4)rocket();}
    else if(amb&&!endMode&&t-lastAuto>3200){lastAuto=t;rocket();}
    ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.24)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    const add=[];
    for(const p of P){
      p.px=p.x;p.py=p.y;
      if(p.rk){p.x+=p.vx;p.y+=p.vy;p.vy+=H*.00018;
        if(p.y<=p.ty||p.vy>-1){p.l=0;add.push([p.x,p.y]);}
        if(Math.random()<.6)P.push({x:p.x,y:p.y,px:p.x,py:p.y,vx:(Math.random()-.5)*.6,vy:Math.random()*.8,l:18,ml:18,c:'#f4b43c',w:1.2});
      }else{p.vx*=.982;p.vy=p.vy*.982+.045;p.x+=p.vx;p.y+=p.vy;p.l--;}
      const al=Math.max(0,Math.min(1,p.l/p.ml*1.4))*(p.tw&&Math.random()<.4?.25:1);
      ctx.globalAlpha=al;ctx.strokeStyle=p.c;ctx.lineWidth=p.w;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();
    }
    ctx.globalAlpha=1;
    P=P.filter(p=>p.l>0&&p.y<H+40);
    add.forEach(([x,y])=>burst(x,y,1));
    if(P.length||endMode||amb){requestAnimationFrame(step);}else{run=false;ctx.clearRect(0,0,W,H);}
  }
  function start(){if(!run){run=true;requestAnimationFrame(step);}}
  function still(n){ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    for(let k=0;k<n;k++){const x=W*(.15+Math.random()*.7),y=H*(.12+Math.random()*.35);
      for(let i=0;i<40;i++){const a=i/40*Math.PI*2,r=40+Math.random()*30;ctx.fillStyle=GOLD[i%GOLD.length];ctx.fillRect(x+Math.cos(a)*r,y+Math.sin(a)*r,2,2);}}
    setTimeout(()=>ctx.clearRect(0,0,W,H),2200);}
  return{
    show(n){if(reduce){still(Math.min(n,4));return;}for(let i=0;i<n;i++)setTimeout(rocket,i*230+Math.random()*120);start();},
    pop(x,y){if(reduce)return;burst(x,y,.35,GOLD);start();},
    end(on){endMode=on&&!reduce;if(on&&reduce)still(5);if(endMode)start();},
    ambient(on){amb=on&&!reduce;if(amb)start();}
  };
})();
function fx(on){FW.end(on);}

/* goud spatje bij elke tik op een antwoord */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.opt');if(b&&!b.disabled)FW.pop(e.clientX,e.clientY);},true);

/* vuurwerk bij goede antwoorden en punten */
let celebSeq=null,celebTask=null,celebLead=null;
function showLeader(id){
  if(!S.players[id])return;let el=$('#leadfx');
  if(!el){el=document.createElement('div');el.id='leadfx';el.className='leadfx';document.body.appendChild(el);el.addEventListener('click',()=>el.hidden=true);}
  el.innerHTML=`<div class="leadcard"><span class="label">Wisseling aan kop</span><div class="leadpic">${avatar(id,170,'party wobble crown')}</div><p class="leadname">${esc(pname(id))}</p><p class="leadsub">${id===S.uid?'Jij staat bovenaan! Niet meer weggaan.':'staat nu bovenaan. Iedereen: pak \'m!'}</p></div>`;
  el.hidden=false;el.classList.remove('go');void el.offsetWidth;el.classList.add('go');
  FW.show(8);clearTimeout(showLeader._t);showLeader._t=setTimeout(()=>{el.hidden=true;},4200);
}
function celebrate(){
  const st=S.state;if(!st)return;
  const tv=(S.owner&&S.view==='tv')||NET.tv;const player=!S.owner&&S.uid&&S.players[S.uid]&&!S.editing;
  FW.ambient(st.phase==='lobby'&&(tv||player));
  if(st.phase==='reveal'&&st.reveal?.leaderChange&&st.seq!==celebLead&&(tv||player)){celebLead=st.seq;setTimeout(()=>showLeader(st.reveal.leaderChange),1600);}
  if(st.phase==='reveal'&&st.seq!==celebSeq){
    celebSeq=st.seq;
    if(tv&&st.q&&!st.q.task)FW.show(5);
    else if(player&&st.q&&!st.q.task){const g=st.q.test?(st.reveal?.answers?.[S.uid]?.c===st.reveal?.correct?600:0):(st.reveal?.gain?.[S.uid]||0);if(g>0)FW.show(g>=1500?14:g>=800?10:6);}
  }
  if(st.phase==='task'&&(tv||player)){
    const g=st.reveal?.gain||{};const key=st.seq+'|'+JSON.stringify(g);
    if(celebTask&&celebTask.split('|')[0]==String(st.seq)&&celebTask!==key){
      const prev=JSON.parse(celebTask.split('|').slice(1).join('|'));
      if(tv?Object.keys(g).some(k=>(g[k]||0)>(prev[k]||0)):(g[S.uid]||0)>(prev[S.uid]||0))FW.show(tv?3:6);}
    celebTask=key;
  }else celebTask=null;
}

/* vaste scorebalk */
const lastPts={};
function renderStrip(){
  const el=$('#strip');const st=S.state;const list=st?ranking():[];
  if(!st||!list.length){el.hidden=true;return;}
  el.hidden=false;
  const top=list[0].pts;
  el.innerHTML=list.map((p,i)=>{const lead=top>0&&p.pts===top;
    return `<div class="cell ${lead?'lead':''} ${p.id===S.uid?'mine-team':''}"><span class="rk">${avatar(p.id,lead?38:32,lead?'party crown':'')}</span><span class="n">${lead?'<small class="lbl">Koploper</small>':''}${esc(p.name)}${p.id===S.uid?' (jij)':''}</span><span class="s" data-sid="${p.id}">${p.pts}</span></div>`;}).join('');
  list.forEach(p=>{if(lastPts[p.id]!==undefined&&p.pts>lastPts[p.id]){const n=el.querySelector('[data-sid="'+p.id+'"]');n&&n.classList.add('bump');}lastPts[p.id]=p.pts;});
}
const _render=render;
render=function(){_render();celebrate();renderStrip();};
</script>
