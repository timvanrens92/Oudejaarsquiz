<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Oudejaarsquiz '92</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&family=Pinyon+Script&display=swap">
<style>
/* Layout: gala-affiche in zwart en goud — gouden titel, vaste scorebalk, één kolom, vier gouden antwoordknoppen A-D */
:root{
  --bg:#070509;
  --panel:rgba(22,17,10,.78);
  --fg:#f7efdc;
  --dim:#b8a888;
  --gold:#e8bd5c;
  --gold-hi:#fff0bf;
  --gold-lo:#9b6a1c;
  --line:rgba(232,189,92,.38);
  --ink:#1a1206;
  --red:#ff3a3a;
  --green:#35e266;
  --yellow:#ffe41f;
  --cyan:#36e6ff;
  --magenta:#ff4ef0;
  --wine:#7a1420;
  --goldfill:linear-gradient(180deg,#fff2c6 0%,#f0c768 38%,#b9832a 62%,#f3d488 100%);
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --script:"Pinyon Script","Snell Roundhand",cursive;
  --read:"Cormorant Garamond",Garamond,Georgia,serif;
  --body:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  --tt:"Cinzel",Georgia,serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
.bokeh{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(circle at 8% 18%,rgba(255,206,110,.22) 0 26px,transparent 60px),
  radial-gradient(circle at 92% 12%,rgba(255,220,140,.18) 0 40px,transparent 90px),
  radial-gradient(circle at 85% 70%,rgba(255,190,90,.14) 0 30px,transparent 80px),
  radial-gradient(circle at 15% 82%,rgba(255,215,130,.12) 0 50px,transparent 110px),
  radial-gradient(circle at 50% 40%,rgba(120,70,10,.25),transparent 70%),
  radial-gradient(ellipse at 50% 0%,rgba(232,189,92,.16),transparent 55%)}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-block:10px 48px;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:1100px}
.masthead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:6px 0}
.masthead .pre{font-family:var(--display);font-size:11px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase;padding-left:.42em}
.masthead h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,9vw,72px);line-height:.95;letter-spacing:.02em;background:var(--goldfill);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(232,170,60,.35))}
.masthead .script{font-family:var(--script);font-size:clamp(36px,10vw,62px);line-height:1;color:var(--gold-hi);margin-top:2px;text-shadow:0 0 18px rgba(255,200,100,.45)}
.masthead .date{display:flex;align-items:center;gap:12px;width:100%;max-width:440px;font-family:var(--display);font-size:12px;letter-spacing:.32em;color:var(--fg);text-transform:uppercase;margin-top:8px}
.masthead .date::before,.masthead .date::after{content:"";flex:1;height:1px;background:var(--line)}
.mosaic{height:6px;width:120px;align-self:center;background:repeating-linear-gradient(90deg,var(--red) 0 24px,var(--green) 24px 48px,var(--yellow) 48px 72px,var(--cyan) 72px 96px,var(--magenta) 96px 120px)}
h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;color:var(--gold);letter-spacing:.04em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:13px;margin:0;color:var(--dim);letter-spacing:.28em;text-transform:uppercase}
.label{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.24em;color:var(--dim)}
.q-text{font-family:var(--read);font-weight:600;font-size:clamp(28px,7.4vw,40px);line-height:1.1;color:var(--fg);margin:0;text-wrap:balance}
.round{font-family:var(--script);font-size:30px;line-height:1;color:var(--gold-hi)}
.muted{color:var(--dim)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,80px);line-height:1;background:var(--goldfill);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-family:var(--read);font-weight:600;font-size:26px;line-height:1.05;text-align:left;color:var(--fg);cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.opt:not(:disabled):active{transform:scale(.98)}
.opt:not(:disabled):hover{border-color:var(--gold)}
.opt .k{display:inline-grid;place-items:center;width:32px;height:32px;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);flex:none;border-radius:2px}
.opt .k{background:var(--goldfill)}.opt.picked .k,.opt.right .k{background:var(--ink);color:var(--gold-hi)}
.opt:disabled{cursor:default}
.opt.dimmed{opacity:.28}
.opt.picked{background:var(--goldfill);color:var(--ink);border-color:var(--gold-hi)}
.opt.right{background:var(--goldfill);color:var(--ink);border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(255,230,160,.5),0 0 34px rgba(255,200,90,.55);animation:shine 1.6s ease-in-out 2}
@keyframes shine{50%{box-shadow:0 0 0 2px rgba(255,240,190,.9),0 0 60px rgba(255,210,110,.9)}}
.timer{height:6px;background:rgba(232,189,92,.15);position:relative;border-radius:3px;overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--goldfill);width:100%}
.timer-row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.timer-row b{font-family:var(--display);font-size:26px;letter-spacing:0;color:var(--yellow);font-weight:400;font-variant-numeric:tabular-nums}
.btn{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;line-height:1.1;padding:12px 18px;border:0;border-radius:3px;background:var(--goldfill);color:var(--ink);cursor:pointer;box-shadow:0 4px 18px rgba(232,170,60,.25)}
.btn.r{background:var(--wine);color:var(--fg);box-shadow:none}
.btn.ghost,.btn.m{background:transparent;color:var(--gold-hi);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{font-size:12px;padding:8px 11px}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,.team.pick:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
input[type=text]{font-family:var(--read);font-weight:600;font-size:24px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:rgba(0,0,0,.5);color:var(--fg);width:100%}
.teams{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.team{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;font-family:var(--read);font-weight:600;font-size:24px;line-height:1.05;background:rgba(0,0,0,.45);border:1px solid rgba(232,189,92,.18);border-radius:3px}
.team .sw{width:6px;height:28px;flex:none;border-radius:1px}
.team .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .pts{font-family:var(--display);font-weight:700;font-size:20px;color:var(--yellow);font-variant-numeric:tabular-nums}
.team .plus{font-family:var(--display);color:var(--green);font-size:16px}
.team.pick{cursor:pointer;width:100%;color:var(--fg);text-align:left}
.team.pick.on{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi),0 0 22px rgba(255,200,90,.3)}
.sw.magenta{background:var(--magenta)}.sw.cyan{background:var(--cyan)}.sw.yellow{background:var(--yellow)}
.notice{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(232,189,92,.08);margin:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.qlist{display:flex;flex-direction:column;gap:2px;max-height:560px;overflow:auto}
.qi{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;background:rgba(0,0,0,.35)}
.qi .p{font-family:var(--display);font-weight:700;font-size:16px;color:var(--gold)}
.qi .t{font-size:13px;line-height:1.3;min-width:0}
.qi.cur{background:rgba(232,189,92,.18)}
.qi.done .t{color:var(--dim)}
.qi .ty{font-family:var(--display);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.rh{font-family:var(--script);font-size:26px;color:var(--gold-hi);padding:10px 0 2px}
.ans{font-family:var(--read);font-weight:700;font-size:24px;color:var(--green);margin:0}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--display);font-size:18px}
.mine{font-family:var(--read);font-weight:700;font-size:32px;line-height:1.05;margin:0}
.mine span[style]{font-family:var(--tt)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--goldfill);color:var(--ink);font-family:var(--body);font-weight:500;padding:10px 16px;border-radius:3px;z-index:9;max-width:90vw}
.searching{font-family:var(--read);font-size:26px;color:var(--fg);text-align:center}
.searching b{color:var(--yellow);font-weight:400}
@media (prefers-reduced-motion:reduce){.opt.right{animation:none}.opt{transition:none}}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.strip .cell{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:5px 10px 5px 6px;background:var(--panel);border:1px solid rgba(232,189,92,.2);border-radius:999px;flex:1 1 calc(33.33% - 6px);min-width:0;max-width:220px}
.strip .cell.lead{border-color:var(--gold-hi);box-shadow:0 0 16px rgba(255,200,90,.28)}
.strip .rk{display:contents}
.strip .rk i{display:inline-block;width:14px;height:4px;border-radius:1px}
.strip .lead .rk{color:var(--gold-hi)}
.strip .n{grid-column:2;font-family:var(--read);font-weight:700;font-size:14px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .s{grid-column:2;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;color:var(--yellow);font-variant-numeric:tabular-nums}
.strip .s.bump{animation:bump 1s ease-out}
@keyframes bump{0%{color:var(--green);transform:scale(1.25);transform-origin:left}100%{transform:none}}
.strip .mine-team{outline:1px dashed var(--line);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.strip .s.bump{animation:none}}
.qr-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:6px;border-radius:3px;width:150px;flex:none;box-shadow:0 0 0 1px var(--gold),0 0 26px rgba(255,200,90,.3)}
.qr-wrap.tvqr .qr{width:min(280px,70vw)}
.qr svg{display:block;width:100%;height:auto}
.qr-wrap.tvqr{flex-direction:column;align-items:center;text-align:center;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
.team .rank{font-family:var(--display);font-weight:700;font-size:15px;color:var(--gold);width:22px;flex:none}
.team.me{border-color:var(--gold-hi)}
.gain{font-family:var(--display);color:var(--gold-hi)}
.btn.spot{background:#1db954;color:#06140a;box-shadow:none;text-decoration:none;display:inline-block}
.autonext{border:1px solid var(--gold-hi);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:rgba(232,189,92,.12)}
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;display:inline-grid;place-items:center;background:var(--goldfill);color:var(--ink);box-shadow:0 0 0 2px var(--gold),0 0 12px rgba(255,200,90,.25)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av b{font-family:var(--display);font-size:calc(var(--s)*.45)}
.av .hat{display:none}
.av.hatty .hat{display:block;position:absolute;left:50%;top:calc(var(--s)*-.42);width:calc(var(--s)*.42);height:calc(var(--s)*.55);transform:translateX(-20%) rotate(18deg);background:repeating-linear-gradient(135deg,var(--magenta) 0 7px,var(--yellow) 7px 14px,var(--cyan) 14px 21px);clip-path:polygon(50% 0,100% 100%,0 100%)}
.av.crown .hat{display:block;position:absolute;left:50%;background:var(--goldfill);clip-path:polygon(0 100%,0 30%,22% 60%,50% 0,78% 60%,100% 30%,100% 100%);width:calc(var(--s)*.6);height:calc(var(--s)*.38);top:calc(var(--s)*-.3);transform:translateX(-50%) rotate(-8deg)}
.av.wobble{animation:wobble 1.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.06)}}
.av.oops{filter:grayscale(1) contrast(1.1);transform:rotate(-14deg)}
.av.sleep{filter:grayscale(1) brightness(.6);transform:rotate(90deg)}
.fastest{display:flex;align-items:center;gap:20px;padding:22px 16px 16px;background:var(--panel);border:1px solid var(--gold-hi);border-radius:3px;box-shadow:0 0 30px rgba(255,200,90,.25)}
.oops-row{display:flex;flex-direction:column;gap:8px}
.crowd{display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center;padding-top:30px}
.crowd-i{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:90px}
.crowd-i small{font-size:12px;color:var(--dim);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.crowd .crowd-i{animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bob{50%{transform:translateY(-10px)}}
.winner{display:flex;justify-content:center;padding-top:60px}
.selfie{align-items:center;text-align:center}
.shot{--s:min(220px,60vw);width:var(--s);height:var(--s);border-radius:50%;position:relative;margin-top:6px;background:rgba(0,0,0,.5);box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(255,200,90,.35);display:grid;place-items:center;color:var(--dim)}
.shot img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.strip .rk .av{grid-row:1/3}
.strip .rk .pos{display:none}
.strip::-webkit-scrollbar{display:none}

@media (prefers-reduced-motion:reduce){.av.wobble,.crowd .crowd-i{animation:none}}
.commentator{border-left:3px solid var(--magenta);padding:10px 14px;background:rgba(255,78,240,.08);display:flex;flex-direction:column;gap:4px}
.commentator p{margin:0;font-family:var(--read);font-weight:600;font-style:italic;font-size:22px;line-height:1.2}
.quip{margin:0;font-family:var(--script);font-size:30px;line-height:1.1;color:var(--gold-hi)}
body.playing .masthead .script,body.playing .masthead .date{display:none}
body.playing .masthead h1{font-size:clamp(22px,6vw,34px)}
body.playing .wrap{gap:12px}
.qr-wrap.tvqr .stack{width:100%;max-width:520px;align-items:center}
.faces{display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){
  body.tv .wrap{max-width:1240px}
  body.tv .q-text{font-size:clamp(34px,3.6vw,54px)}
  body.tv .opts{grid-template-columns:1fr 1fr}
  body.tv .opt{min-height:72px;font-size:30px}
  body.tv .tv-lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;align-items:start}
  body.tv .tv-lobby .crowd{justify-content:flex-start}
  body.tv .faces{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  body.tv .faces .commentator{grid-column:1/-1}
  body.tv.playing .masthead{display:none}
}
@media (min-width:700px){.strip .cell{flex:1 1 120px;max-width:none}}
.endhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.av.party::before{content:"";position:absolute;inset:calc(var(--s)*-.07);border-radius:50%;background:conic-gradient(from var(--ang,0deg),#fff2c6,#f0c768,#b9832a,#ff4ef0,#36e6ff,#ffe41f,#fff2c6);z-index:-1;animation:spinring 4s linear infinite;filter:drop-shadow(0 0 10px rgba(255,200,90,.6))}
.av.party{z-index:0;isolation:isolate}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spinring{to{--ang:360deg}}
.av.crown{isolation:isolate}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font-family:var(--body);font-weight:500;font-size:14px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--fg);cursor:pointer}
.chip.on{background:var(--goldfill);color:var(--ink);border-color:var(--gold-hi)}
.fxpick{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
@media (prefers-reduced-motion:reduce){.av.party::before{animation:none}}
.mult{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;padding:4px 10px;border-radius:999px;background:var(--goldfill);color:var(--ink);box-shadow:0 0 16px rgba(255,200,90,.45);align-self:center}
.netbar{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:20;background:var(--wine);color:var(--fg);font-family:var(--body);font-weight:500;padding:8px 14px;border-radius:999px;max-width:92vw;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.netstat{display:flex;align-items:center;gap:8px;font-size:13px}
.netstat i{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:none}
.netstat.off i{background:var(--red);box-shadow:0 0 8px var(--red)}
</style>

<div class="bokeh" aria-hidden="true"></div>
<div class="wrap" id="wrap">
    <header class="masthead">
    <h1>Oudejaarsquiz</h1>
    <span class="script">Back to the 00s</span>
    <span class="date">31 december · op naar 2027</span>
  </header>
    <div id="strip" class="strip" hidden aria-label="Tussenstand"></div>
  <main id="app" class="stack" aria-live="polite">
    <p class="searching">Even laden…</p>
  </main>
</div>
<canvas id="fx"></canvas>
<div id="toast" class="toast" hidden></div>
<div id="netbar" class="netbar" hidden></div>

<script>
/* ---------- Verbinding: de spelleider is de server, telefoons verbinden rechtstreeks ---------- */
(function(){
  const QS=new URLSearchParams(location.search);
  const JOIN=QS.get('join');
  const IS_HOST=!JOIN;
  const PEER_OPTS=QS.get('peerhost')?{host:QS.get('peerhost'),port:+(QS.get('peerport')||9000),path:'/',secure:false,debug:0}:{debug:0};
  const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
  const rid=(n=10)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
  const PUBLIC=p=>p==='game/state'||p.startsWith('players/');
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const NET=window.NET={tv:!!QS.get('tv')&&!IS_HOST,host:IS_HOST,status:'connecting',peers:0,hostId:null,pid:null,onchange:()=>{}};

  /* gedeelde in-memory database met dezelfde vorm als de Claude-versie */
  function makeStore(data,writer){
    let subs=[];const ready={v:false};
    const notify=()=>{if(!ready.v)return;setTimeout(()=>subs.slice().forEach(f=>{try{f();}catch(e){console.error(e);}}),0);};
    const snap=p=>({id:p.split('/').pop(),exists:data[p]!==undefined,data:()=>clone(data[p]),metadata:{fromCache:false,hasPendingWrites:false}});
    function doc(p){return{path:p,id:p.split('/').pop(),get:async()=>snap(p),
      set:async v=>writer(p,clone(v)),update:async v=>writer(p,Object.assign({},data[p],clone(v))),delete:async()=>writer(p,null),
      onSnapshot(n){const f=()=>n(snap(p));subs.push(f);if(ready.v)setTimeout(f,0);return()=>{subs=subs.filter(x=>x!==f);};},
      collection:c=>col(p+'/'+c)};}
    function col(p){const n=p.split('/').length;const q=()=>{const docs=Object.keys(data).filter(k=>k.startsWith(p+'/')&&k.split('/').length===n+1).sort().map(snap);return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}};};
      return{path:p,doc:id=>doc(p+'/'+(id||rid())),get:async()=>q(),
        onSnapshot(nx){const f=()=>nx(q());subs.push(f);if(ready.v)setTimeout(f,0);return()=>{subs=subs.filter(x=>x!==f);};}};}
    return{db:{doc,collection:col},data,notify,setReady(){ready.v=true;notify();}};
  }

  let store,peer;
  if(IS_HOST){
    /* ---------- spelleider ---------- */
    NET.hostId=LS.get('okq-hostid',null)||('okq-'+rid(12));LS.set('okq-hostid',NET.hostId);
    NET.pid='host';
    const saved=LS.get('okq-data',{});
    const conns=new Map();
    let saveT=0;
    const persist=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{const d={};for(const k in store.data)if(k!=='quiz/bank')d[k]=store.data[k];LS.set('okq-data',d);},300);};
    const broadcast=(msg)=>{for(const c of conns.values()){try{if(c.open)c.send(msg);}catch(e){}}};
    const apply=(p,v)=>{if(v===null)delete store.data[p];else store.data[p]=v;persist();store.notify();if(PUBLIC(p))broadcast({t:'put',p,v});};
    store=makeStore(saved,async(p,v)=>apply(p,v));
    store.data['quiz/bank']=window.__BANK;
    if(!store.data['game/state'])store.data['game/state']={phase:'lobby',seq:0,idx:-1,q:null,openedAt:0,reveal:null,scores:{},done:[]};
    store.setReady();
    const publicSnap=()=>{const d={};for(const k in store.data)if(PUBLIC(k))d[k]=store.data[k];return d;};
    const status=()=>{NET.peers=[...conns.values()].filter(c=>c.open).length;NET.onchange();};
    function start(){
      NET.status='connecting';NET.onchange();
      peer=new Peer(NET.hostId,PEER_OPTS);
      peer.on('open',()=>{NET.status='online';NET.onchange();});
      peer.on('connection',c=>{
        c.on('open',()=>{status();});
        c.on('data',m=>{
          if(!m||typeof m!=='object')return;
          if(m.t==='hello'&&typeof m.pid==='string'&&/^[a-z0-9]{6,20}$/.test(m.pid)){c.__pid=m.pid;conns.set(c.connectionId,c);c.send({t:'snap',d:publicSnap()});status();return;}
          const pid=c.__pid;if(!pid)return;
          if(m.t==='write'&&(m.p==='players/'+pid||m.p==='answers/'+pid)){
            let v=m.v;
            if(v!==null&&(typeof v!=='object'||JSON.stringify(v).length>200000))return;
            if(m.p.startsWith('players/')&&v){v={name:String(v.name||'').slice(0,20),photo:typeof v.photo==='string'&&v.photo.startsWith('data:image/')?v.photo:undefined};if(!v.photo)delete v.photo;}
            if(m.p.startsWith('answers/')&&v){v={seq:+v.seq,c:+v.c,ms:+v.ms};}
            apply(m.p,v);
          }
        });
        c.on('close',()=>{conns.delete(c.connectionId);status();});
        c.on('error',()=>{conns.delete(c.connectionId);status();});
      });
      peer.on('disconnected',()=>{NET.status='reconnecting';NET.onchange();setTimeout(()=>{try{peer.reconnect();}catch(e){}},1500);});
      peer.on('error',e=>{
        if(e.type==='unavailable-id'){NET.status='waiting';NET.onchange();try{peer.destroy();}catch(_){}setTimeout(start,3000);}
        else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){NET.status='reconnecting';NET.onchange();try{peer.destroy();}catch(_){}setTimeout(start,3000);}
      });
    }
    start();
    NET.joinUrl=()=>{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('join',NET.hostId);if(QS.get('peerhost')){u.searchParams.set('peerhost',QS.get('peerhost'));u.searchParams.set('peerport',QS.get('peerport')||'9000');}return u.toString();};
    NET.tvUrl=()=>{const u=new URL(NET.joinUrl());u.searchParams.set('tv','1');return u.toString();};
    NET.newGame=()=>{LS.set('okq-data',{});location.reload();};
  }else{
    /* ---------- speler ---------- */
    NET.hostId=JOIN;
    if(NET.tv){NET.pid='tv'+rid(8);}else{NET.pid=LS.get('okq-pid',null)||rid(12);LS.set('okq-pid',NET.pid);}
    let conn=null,retry=0;
    store=makeStore({},async(p,v)=>{
      if(!conn||!conn.open)throw new Error('offline');
      conn.send({t:'write',p,v});
      if(v===null)delete store.data[p];else store.data[p]=v;store.notify();
    });
    const own=()=>{const d={};for(const k of ['answers/'+NET.pid])if(store.data[k]!==undefined)d[k]=store.data[k];return d;};
    function connect(){
      if(!peer||peer.destroyed){peer=new Peer(PEER_OPTS);peer.on('open',dial);peer.on('error',e=>{if(e.type==='peer-unavailable'){NET.status='nohost';NET.onchange();setTimeout(dial,3000);}else{NET.status='reconnecting';NET.onchange();setTimeout(()=>{try{peer.destroy();}catch(_){}connect();},3000);}});peer.on('disconnected',()=>{setTimeout(()=>{try{peer.reconnect();}catch(e){}},1500);});}
      else dial();
    }
    function dial(){
      if(conn&&conn.open)return;
      NET.status=retry?'reconnecting':'connecting';NET.onchange();
      conn=peer.connect(JOIN,{reliable:true});
      conn.on('open',()=>{retry=0;conn.send({t:'hello',pid:NET.pid});});
      conn.on('data',m=>{
        if(m.t==='snap'){const keep=own();for(const k of Object.keys(store.data))delete store.data[k];Object.assign(store.data,m.d,keep);NET.status='online';NET.onchange();store.setReady();store.notify();}
        else if(m.t==='put'){if(m.v===null)delete store.data[m.p];else store.data[m.p]=m.v;store.notify();}
      });
      const lost=()=>{if(NET.status==='online'){NET.status='reconnecting';NET.onchange();}retry++;setTimeout(dial,Math.min(5000,800*retry));};
      conn.on('close',lost);conn.on('error',lost);
    }
    connect();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(!conn||!conn.open))dial();});
    NET.joinUrl=()=>{const u=new URL(location.href);u.searchParams.delete('tv');return u.toString();};
  }
  const user={isOwner:async()=>IS_HOST,id:async()=>NET.tv?null:NET.pid,canEdit:async()=>IS_HOST,can:async()=>null};
  window.claude={use:async n=>n==='db'?store.db:n==='user'?user:null};
})();
</script>

<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEYLBL=['A','B','C','D'];
const JOIN_URL=NET.joinUrl();
const S={db:null,user:null,uid:null,owner:false,state:null,stateLoaded:false,bank:null,players:{},answers:{},myAns:null,
  local:{seq:null,start:0,expired:false},view:'regie',controller:false,revealing:false,editing:false,resetArm:0,delArm:null,loadErr:''};

function defaultState(){return{phase:'lobby',seq:0,idx:-1,q:null,openedAt:0,reveal:null,scores:{},done:[]};}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3500);}
function wake(){try{navigator.wakeLock?.request('screen').catch(()=>{})}catch(e){}}

/* ---------- opstarten ---------- */
(async function init(){
  const loadTimer=setTimeout(()=>{if(!S.stateLoaded){S.loadErr='De quiz is nog niet bereikbaar. Controleer je verbinding; de pagina blijft het proberen.';render();}},10000);
  if(!window.claude?.use){renderNoAccess();return;}
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db){clearTimeout(loadTimer);renderNoAccess();return;}
  S.db=db;S.user=user;
  S.owner=user?await user.isOwner():false;
  S.uid=user?await user.id():null;
  const fail=()=>{S.loadErr='Verbinding met de quiz verbroken. Laad de pagina opnieuw.';render();};
  db.doc('game/state').onSnapshot(s=>{
    S.state=s.exists?s.data():null;
    if(!s.metadata.fromCache){S.stateLoaded=true;clearTimeout(loadTimer);S.loadErr='';}
    else S.stateLoaded=S.stateLoaded||!!S.state;
    onState();
  },fail);
  db.collection('players').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.players=m;render();},fail);
  if(S.owner){
    db.doc('quiz/bank').onSnapshot(s=>{S.bank=s.exists?s.data():null;render();},fail);
    db.collection('answers').onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.answers=m;render();checkAuto();},fail);
  }else if(S.uid){
    db.doc('answers/'+S.uid).onSnapshot(s=>{S.myAns=s.exists?s.data():null;render();},()=>{});
  }
  render();
})();

  const st=S.state;

}

function commentary(st){
  const rv=st.reveal||{};const ans=rv.answers||{};const ids=playerIds();const seq=st.seq||0;
  if(!ids.length||st.q?.test)return '';
  const good=ids.filter(id=>ans[id]&&ans[id].c===rv.correct);
  if(rv.leaderChange&&S.players[rv.leaderChange])return fill(pick(LINES.lead,seq),{name:pname(rv.leaderChange)});
  if(good.length===ids.length&&ids.length>1)return pick(LINES.all,seq);
  if(!good.length)return pick(LINES.none,seq);
  const sk=st.streak||{};
  const hot=ids.filter(id=>(sk[id]||0)>=3).sort((a,b)=>sk[b]-sk[a])[0];
  const cold=ids.filter(id=>(sk[id]||0)<=-3).sort((a,b)=>sk[a]-sk[b])[0];
  if(hot&&(seq%2||!cold))return fill(pick(LINES.hot,seq),{name:pname(hot),n:sk[hot]});
  if(cold)return fill(pick(LINES.cold,seq),{name:pname(cold),n:-sk[cold]});
  const f=good.sort((a,b)=>ans[a].ms-ans[b].ms)[0];
  return fill(pick(LINES.fast,seq),{name:pname(f)});
}
function personal(st){
  const rv=st.reveal||{};const my=rv.answers?.[S.uid];const n=st.streak?.[S.uid]||0;const seq=st.seq||0;
  if(n>=3)return fill(pick(LINES.meHot,seq),{n});
  if(n<=-3)return fill(pick(LINES.meCold,seq),{n:-n});
  if(!my)return pick(LINES.meNone,seq);
  return pick(my.c===rv.correct?LINES.meGood:LINES.meBad,seq);
}
function revealFaces(rv){
  const ans=rv.answers||{};const gain=rv.gain||{};
  const good=Object.keys(ans).filter(id=>ans[id].c===rv.correct&&S.players[id]).sort((a,b)=>ans[a].ms-ans[b].ms);
  const bad=Object.keys(ans).filter(id=>ans[id].c!==rv.correct&&S.players[id]);
  const none=playerIds().filter(id=>!ans[id]);
  let h='';
  if(good.length){const f=good[0];h+=`<div class="fastest">${avatar(f,110,'party wobble')}<div class="stack" style="gap:2px;min-width:0"><span class="label">Snelste vinger</span><span class="mine">${esc(pname(f))}</span><span class="muted">${(ans[f].ms/1000).toFixed(1)} sec${gain[f]?` · +${gain[f]}`:''}</span></div></div>`;}
  if(bad.length||none.length)h+=`<div class="oops-row"><span class="label">${bad.length?'Oeps, fout':'Te laat'}</span><div class="row">${bad.map(id=>`<span class="crowd-i">${avatar(id,52,'oops')}<small>${esc(pname(id))}</small></span>`).join('')}${none.map(id=>`<span class="crowd-i">${avatar(id,52,'sleep')}<small>${esc(pname(id))} · zzz</small></span>`).join('')}</div></div>`;
  return h;
}

async function loadRaw(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
    const n=360,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');
    const m=Math.min(img.naturalWidth,img.naturalHeight);
    x.translate(n,0);x.scale(-1,1);
    x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,n,n);
    return c;}
  finally{URL.revokeObjectURL(url);}
}

      ${!tv&&mine!==null?`<p class="notice">Antwoord binnen in ${(S.myAns.ms/1000).toFixed(1)} seconden. Wachten op de rest…</p>`:''}
      ${!tv&&mine===null&&rem<=0?`<p class="notice">De tijd is om.</p>`:''}
    </div>`;
  }else if(st.phase==='task'){

  }else if(st.phase==='reveal'){

    h=`<div class="stack"><span class="round">${esc(q?.round)}</span><p class="q-text">${esc(q?.text)}</p>

      ${!tv&&q?.test?`<p class="mine">${my&&my.c===rv.correct?'Goed! Je snapt hoe het werkt.':(my?'Fout, maar dit was oefenen.':'Geen antwoord gegeven.')} <span class="muted" style="font-size:18px">Oefenvraag, telt niet mee.</span></p>`:''}
      ${!tv&&q&&!q.task&&!q.test?`<p class="mine">${myGain>0?`Goed! <span class="gain">+${myGain}</span>`:(my?'Helaas, fout':'Geen antwoord gegeven')}</p>`:''}
      ${!tv&&q?.task&&myGain?`<p class="mine">Jij kreeg <span class="gain">+${myGain}</span></p>`:''}
      ${!tv&&q&&!q.task&&!q.test?`<p class="quip">${esc(personal(st))}</p>`:''}
      <div class="faces">${q&&!q.task&&commentary(st)?`<div class="commentator"><span class="label">De commentator</span><p>${esc(commentary(st))}</p></div>`:''}
      ${q&&!q.task?revealFaces(rv):''}</div>

  }else if(st.phase==='end'){
    const list=ranking();const w=list[0];
    h=`<div class="stack"><div class="endhero"><span class="round">Eindstand</span>${w?`<div class="winner">${avatar(w.id,180,'party wobble crown')}</div>`:''}<p class="big" style="margin:0">${esc(w?.name||'')}</p>
      <p class="q-text">wint de Oudejaarsquiz met ${w?.pts||0} punten.</p></div>${scoreboard(false)}
      <p class="muted">Gelukkig nieuwjaar en een knallend 2027.</p></div>`;
  }
  return h;
}

/* ---------- spelleider ---------- */

  const st=S.state;

  }else if(st.phase==='task'&&it){
    const g=st.reveal?.gain||{};
    now=`${itemHead(it)}${it.host?`<p class="notice">${esc(it.host)}</p>`:''}
      <span class="label">Punten geven</span>
      ${ids.length?ids.map(id=>`<div class="row"><span class="team" style="flex:1;min-width:150px"><span class="nm">${esc(pname(id))}</span><span class="plus">+${g[id]||0}</span></span>
        <button class="btn sm" data-act="award" data-u="${id}" data-p="${Math.round(250*(st.q?.mult||1))}">+${Math.round(250*(st.q?.mult||1))}</button><button class="btn sm" data-act="award" data-u="${id}" data-p="${Math.round(500*(st.q?.mult||1))}">+${Math.round(500*(st.q?.mult||1))}</button><button class="btn sm" data-act="award" data-u="${id}" data-p="${Math.round(1000*(st.q?.mult||1))}">+${Math.round(1000*(st.q?.mult||1))}</button><button class="btn sm ghost" data-act="award" data-u="${id}" data-p="${-Math.round(250*(st.q?.mult||1))}">−${Math.round(250*(st.q?.mult||1))}</button></div>`).join(''):'<p class="muted">Nog geen spelers.</p>'}
      <div class="row"><button class="btn" data-act="taskdone">Opdracht afronden</button></div>`;
  }else if(st.phase==='reveal'){
    const ni=nextIdx();

      ${an?`<div class="autonext"><p style="margin:0"><b>Skip nu naar het volgende nummer.</b> De volgende muziekvraag start over <b data-auto>${Math.max(0,Math.ceil((an.at-Date.now())/1000))}</b> seconden.</p><div class="row"><button class="btn sm" data-act="release" data-i="${an.idx}">Nu starten</button><button class="btn sm ghost" data-act="pauseauto">Pauzeer</button></div></div>`:''}
      <div class="row">${ni<bank.length?`<button class="btn" data-act="release" data-i="${ni}">Volgende: vraag ${pageNo(ni)}</button>`:''}<button class="btn ghost" data-act="lobby">Wachtscherm</button><button class="btn ghost" data-act="end">Eindstand tonen</button></div>`;

  const sc=st.scores||{};
  app.innerHTML=`${tabs}<div class="grid2">
    <div class="stack">
      <div class="panel"><span class="label">Nu op de telefoons · ${phaseName(st.phase)}</span>${now}</div>
      <div class="panel">${qrBlock(false)}</div>
      <div class="panel"><span class="label">Spelers · ${ids.length} aangemeld</span>
        ${ids.length?`<div class="teams">${ranking().map(p=>`<div class="team">${avatar(p.id,34)}<span class="nm">${esc(p.name)}</span><span class="pts">${p.pts}</span><button class="btn sm ${S.delArm===p.id?'r':'ghost'}" data-act="del" data-u="${p.id}">${S.delArm===p.id?'Zeker?':'Verwijder'}</button></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Nog niemand. Laat de QR-code scannen.</p>'}
      </div>
      <div class="panel"><span class="label">Alleen testen</span>
        <p style="margin:0;font-size:14px">Testspelers geven vanzelf antwoord, meestal goed, zodat je de hele quiz alleen kunt doorlopen. Kijk op het tabblad TV-scherm wat de spelers zien.</p>
        <div class="row">${hasBots()?`<button class="btn sm ghost" data-act="botsoff">Testspelers verwijderen</button>`:`<button class="btn sm" data-act="botson">Voeg 3 testspelers toe</button>`}</div></div>
      <div class="panel"><span class="label">Spel</span><div class="row"><button class="btn ghost sm" data-act="lobby">Wachtscherm</button><button class="btn ghost sm" data-act="end">Eindstand</button><button class="btn sm ${S.newArm>Date.now()?'r':'ghost'}" data-act="newgame">${S.newArm>Date.now()?'Klik nogmaals: alles wissen':'Nieuw spel'}</button><button class="btn sm ${S.resetArm>Date.now()?'r':'ghost'}" data-act="reset">${S.resetArm>Date.now()?'Klik nogmaals: alles op 0':'Scores resetten'}</button></div></div>
    </div>
    <div class="panel"><span class="label">Vragenlijst · ${bank.length} onderdelen</span>${bank.length?`<div class="qlist">${rounds}</div>`:'<p class="muted">De vragen worden geladen…</p>'}</div>
  </div>`;
}
function spotify(it,sm){return it.song?`<a class="btn ${sm?'sm':''} spot" href="https://open.spotify.com/search/${encodeURIComponent(it.song)}" target="_blank" rel="noopener">Open in Spotify</a>`:'';}
const multTxt=m=>'×'+String(m||1).replace('.',',');
function multBadge(m){return (m||1)>1?`<span class="mult">${multTxt(m)} punten</span>`:'';}
function itemHead(it){return `<span class="round">${esc(it.round)}</span>${multBadge(it.mult)}<p class="q-text" style="font-size:30px">${esc(it.text)}</p>`;}
function phaseName(p){return({lobby:'wachtscherm',open:'vraag loopt',task:'opdracht',reveal:'antwoord getoond',end:'eindstand'})[p]||p;}
function nextIdx(){const st=S.state;const bank=S.bank?.items||[];const done=st?.done||[];
  for(let i=Math.max(0,st?.idx??0);i<bank.length;i++)if(!done.includes(i))return i;
  for(let i=0;i<bank.length;i++)if(!done.includes(i))return i;return bank.length;}

async function save(next){
  S.state=next;render();
  try{await S.db.doc('game/state').set(next);}catch(e){toast('Opslaan mislukt. Probeer het opnieuw.');}
}
const BOTS=[['test-anna','Test Anna'],['test-bram','Test Bram'],['test-kim','Test Kim']];
const hasBots=()=>BOTS.some(([id])=>S.players[id]);
async function addBots(){try{for(const [id,name] of BOTS)await S.db.doc('players/'+id).set({name,test:true});toast('3 testspelers toegevoegd.');}catch(e){toast('Testspelers toevoegen mislukt.');}}
async function removeBots(){try{for(const [id] of BOTS){await S.db.doc('players/'+id).delete();await S.db.doc('answers/'+id).delete();}
  const sc={...(S.state.scores||{})};BOTS.forEach(([id])=>delete sc[id]);await save({...S.state,scores:sc});toast('Testspelers verwijderd.');}catch(e){toast('Verwijderen mislukt.');}}
function runBots(seq,it){
  if(!it||it.type==='task')return;const lim=(it.limit||20)*1000;
  BOTS.forEach(([id])=>{if(!S.players[id])return;
    const ms=Math.round(1500+Math.random()*lim*.6);
    const c=Math.random()<.65?it.correct:Math.floor(Math.random()*it.options.length);
    setTimeout(()=>{if(S.state?.seq===seq&&S.state.phase==='open')S.db.doc('answers/'+id).set({seq,c,ms}).catch(()=>{});},ms);});
}
async function release(i){
  S.autoNext=null;
  const it=S.bank?.items?.[i];if(!it)return;const st=S.state;
  const q={type:it.type,round:it.round,text:it.text,options:it.options||[],limit:it.limit||20,mult:it.mult||1,task:it.type==='task',test:!!it.test};
  S.controller=true;
  await save({...st,phase:it.type==='task'?'task':'open',idx:i,seq:(st.seq||0)+1,q,openedAt:Date.now(),reveal:it.type==='task'?{gain:{}}:null});
  runBots(S.state.seq,it);
}
async function reveal(){
  const st=S.state;if(S.revealing||st?.phase!=='open')return;const it=S.bank?.items?.[st.idx];if(!it)return;
  S.revealing=true;
  const answers={},gain={},scores={...(st.scores||{})};
  for(const id of playerIds()){const a=S.answers[id];
    if(a&&a.seq===st.seq){answers[id]={c:a.c,ms:a.ms};
      if(a.c===it.correct&&!it.test){const p=Math.round((500+500*Math.max(0,1-a.ms/(st.q.limit*1000)))*(st.q.mult||1));gain[id]=p;scores[id]=(scores[id]||0)+p;}}}
  const streak={...(st.streak||{})};let leaderChange=null;
  if(!it.test){for(const id of playerIds()){const ok=answers[id]&&answers[id].c===it.correct;const v=streak[id]||0;streak[id]=ok?Math.max(0,v)+1:Math.min(0,v)-1;}
    const top=Object.entries(scores).filter(([id])=>S.players[id]).sort((a,b)=>b[1]-a[1])[0];
    if(top&&top[1]>0&&st.leader&&top[0]!==st.leader)leaderChange=top[0];
    var leader=top&&top[1]>0?top[0]:(st.leader||null);}
  await save({...st,phase:'reveal',reveal:{correct:it.correct,answers,gain,leaderChange},scores,streak,leader:leader??st.leader??null,done:[...new Set([...(st.done||[]),st.idx])]});
  S.revealing=false;
  const nx=S.bank.items[st.idx+1];
  if(it.type==='music'&&nx&&nx.type==='music'){S.autoNext={at:Date.now()+8000,idx:st.idx+1};render();}
}
function checkAuto(){
  const st=S.state;if(!S.owner||!S.controller||st?.phase!=='open')return;
  const ids=playerIds();const allIn=ids.length>0&&ids.every(id=>S.answers[id]?.seq===st.seq);
  if(allIn||remainingHost()<-1.5)reveal();
}
async function award(uid,p){
  const st=S.state;if(st.phase!=='task')return;
  const gain={...(st.reveal?.gain||{})};gain[uid]=(gain[uid]||0)+p;
  const scores={...(st.scores||{})};scores[uid]=(scores[uid]||0)+p;
  await save({...st,reveal:{gain},scores});
}

/* ---------- events ---------- */
document.addEventListener('submit',async e=>{
  if(e.target.id!=='joinform')return;e.preventDefault();
  const name=($('#nm')?.value||'').trim();if(!name){toast('Vul je naam in.');return;}
  wake();
  try{const cur=S.players[S.uid]||{};await S.db.doc('players/'+S.uid).set({...cur,name});S.editing=false;render();}
  catch(err){toast('Geen verbinding met de spelleider. Probeer het zo nog een keer.');}
});
document.addEventListener('click',async e=>{
  if(S.owner)wake();
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;const st=S.state;
  if(a==='ans'){wake();const i=+b.dataset.i;const ms=Math.round(performance.now()-S.local.start);
    if(!st||st.phase!=='open'||answeredMine()||ms>st.q.limit*1000)return;
    S.myAns={seq:st.seq,c:i,ms};render();
    try{await S.db.doc('answers/'+S.uid).set({seq:st.seq,c:i,ms});}catch(err){S.myAns=null;toast('Antwoord niet verstuurd. Tik nog een keer.');render();}
  }
  else if(a==='pauseauto'){S.autoNext=null;render();}
  else if(a==='newgame'){if(S.newArm>Date.now()){NET.newGame();}else{S.newArm=Date.now()+4000;render();setTimeout(render,4100);}}
  else if(a==='tvwin'){const w=window.open(NET.tvUrl(),'okq-tv','popup=yes,width=1280,height=720');if(!w)toast('Je browser blokkeert het venster. Sta pop-ups toe voor deze site.');}
  else if(a==='fs'){try{await document.documentElement.requestFullscreen();}catch(err){toast('Druk op F11 voor volledig scherm.');}render();}
  else if(a==='botson'){await addBots();}
  else if(a==='botsoff'){await removeBots();}
  else if(a==='edit'){S.editing=true;render();}
  else if(a==='retake'){S.retake=true;S.shot=null;S.raw=null;render();}
  else if(a==='canceledit'){S.editing=false;S.retake=false;S.shot=null;render();}
  else if(a==='fxf'){S.fx.f=b.dataset.k;await recompose();}
  else if(a==='fxp'){const k=b.dataset.k;S.fx.props=S.fx.props.includes(k)?S.fx.props.filter(z=>z!==k):[...S.fx.props,k];await recompose();}
  else if(a==='usephoto'){const photo=S.shot;if(!photo)return;
    try{await S.db.doc('players/'+S.uid).set({...(S.players[S.uid]||{}),photo});S.shot=null;S.raw=null;S.retake=false;render();toast('Lekker ding. Je doet mee!');}
    catch(err){toast('Foto opslaan mislukt. Probeer het opnieuw.');}}
  else if(a==='copy'){try{await navigator.clipboard.writeText(JOIN_URL);toast('Link gekopieerd.');}catch(err){toast('Kopiëren lukt hier niet. Selecteer de link onder de code.');}}
  else if(a==='view'){S.view=b.dataset.v;render();}
  else if(a==='setup'){await save(defaultState());}
  else if(a==='release'){await release(+b.dataset.i);}
  else if(a==='reveal'){S.controller=true;await reveal();}
  else if(a==='award'){await award(b.dataset.u,+b.dataset.p);}
  else if(a==='taskdone'){await save({...st,phase:'reveal',reveal:{gain:st.reveal?.gain||{}},done:[...new Set([...(st.done||[]),st.idx])]});}
  else if(a==='lobby'){await save({...st,phase:'lobby',reveal:null});}
  else if(a==='end'){await save({...st,phase:'end'});}
  else if(a==='del'){const u=b.dataset.u;
    if(S.delArm===u){S.delArm=null;try{await S.db.doc('players/'+u).delete();}catch(err){toast('Verwijderen mislukt.');}
      const sc={...(st.scores||{})};delete sc[u];await save({...st,scores:sc});}
    else{S.delArm=u;render();setTimeout(()=>{if(S.delArm===u){S.delArm=null;render();}},4000);}}
  else if(a==='reset'){if(S.resetArm>Date.now()){S.resetArm=0;await save({...st,phase:'lobby',scores:{},streak:{},leader:null,reveal:null,done:[],idx:-1});}
    else{S.resetArm=Date.now()+4000;render();setTimeout(render,4100);}}
});

/* ---------- timers ---------- */
setInterval(()=>{
  const an=S.autoNext;
  if(an&&S.owner){if(S.state?.phase!=='reveal'){S.autoNext=null;}else if(Date.now()>=an.at){release(an.idx);}else{const el=document.querySelector('[data-auto]');if(el)el.textContent=Math.max(0,Math.ceil((an.at-Date.now())/1000));}}
  const st=S.state;if(st?.phase!=='open'||!st.q)return;
  document.querySelectorAll('[data-timer]').forEach(el=>{const r=el.dataset.timer==='host'?remainingHost():remainingPlayer();el.textContent=Math.max(0,Math.ceil(r));});
  document.querySelectorAll('[data-bar]').forEach(el=>{const r=el.dataset.bar==='host'?remainingHost():remainingPlayer();el.style.width=Math.max(0,r/st.q.limit*100)+'%';});
  if(!S.owner&&!S.local.expired&&remainingPlayer()<=0){S.local.expired=true;render();}
  checkAuto();
},200);

/* ---------- vuurwerk ---------- */
const FW=(()=>{
  const c=$('#fx'),ctx=c.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GOLD=['#fff4cc','#ffd76a','#f4b43c','#ffe7a3','#ffffff','#f0c060'];
  const TT=['#ff3a3a','#35e266','#36e6ff','#ff4ef0','#ffe41f'];
  let P=[],run=false,W=0,H=0,endMode=false,amb=false,lastAuto=0;
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
  size();addEventListener('resize',size);
  function burst(x,y,scale=1,pal){
    pal=pal||(Math.random()<.72?GOLD:TT);
    const n=Math.round(90*scale),ring=Math.random()<.4;
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(ring?3.2:1+Math.random()*3.4)*scale*(H>700?1.25:1);
      P.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+Math.random()*50,ml:110,c:pal[Math.random()*pal.length|0],w:1+Math.random()*1.6,tw:Math.random()<.35});}
    for(let i=0;i<14*scale;i++)P.push({x,y,px:x,py:y,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,l:30,ml:30,c:'#fff',w:3,tw:false});
  }
  function rocket(){
    const x=W*(.12+Math.random()*.76);
    P.push({rk:true,x,y:H+10,px:x,py:H+10,vx:(Math.random()-.5)*1.2,vy:-(H*.016+Math.random()*H*.006),ty:H*(.12+Math.random()*.32),c:'#ffe7a3',l:999,ml:999,w:2});
  }
  function step(t){
    if(endMode&&t-lastAuto>420){lastAuto=t;rocket();if(Math.random()<.4)rocket();}
    else if(amb&&!endMode&&t-lastAuto>3200){lastAuto=t;rocket();}
    ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.24)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    const add=[];
    for(const p of P){
      p.px=p.x;p.py=p.y;
      if(p.rk){p.x+=p.vx;p.y+=p.vy;p.vy+=H*.00018;
        if(p.y<=p.ty||p.vy>-1){p.l=0;add.push([p.x,p.y]);}
        if(Math.random()<.6)P.push({x:p.x,y:p.y,px:p.x,py:p.y,vx:(Math.random()-.5)*.6,vy:Math.random()*.8,l:18,ml:18,c:'#f4b43c',w:1.2});
      }else{p.vx*=.982;p.vy=p.vy*.982+.045;p.x+=p.vx;p.y+=p.vy;p.l--;}
      const al=Math.max(0,Math.min(1,p.l/p.ml*1.4))*(p.tw&&Math.random()<.4?.25:1);
      ctx.globalAlpha=al;ctx.strokeStyle=p.c;ctx.lineWidth=p.w;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();
    }
    ctx.globalAlpha=1;
    P=P.filter(p=>p.l>0&&p.y<H+40);
    add.forEach(([x,y])=>burst(x,y,1));
    if(P.length||endMode||amb){requestAnimationFrame(step);}else{run=false;ctx.clearRect(0,0,W,H);}
  }
  function start(){if(!run){run=true;requestAnimationFrame(step);}}
  function still(n){ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    for(let k=0;k<n;k++){const x=W*(.15+Math.random()*.7),y=H*(.12+Math.random()*.35);
      for(let i=0;i<40;i++){const a=i/40*Math.PI*2,r=40+Math.random()*30;ctx.fillStyle=GOLD[i%GOLD.length];ctx.fillRect(x+Math.cos(a)*r,y+Math.sin(a)*r,2,2);}}
    setTimeout(()=>ctx.clearRect(0,0,W,H),2200);}
  return{
    show(n){if(reduce){still(Math.min(n,4));return;}for(let i=0;i<n;i++)setTimeout(rocket,i*230+Math.random()*120);start();},
    pop(x,y){if(reduce)return;burst(x,y,.35,GOLD);start();},
    end(on){endMode=on&&!reduce;if(on&&reduce)still(5);if(endMode)start();},
    ambient(on){amb=on&&!reduce;if(amb)start();}
  };
})();
function fx(on){FW.end(on);}

/* goud spatje bij elke tik op een antwoord */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.opt');if(b&&!b.disabled)FW.pop(e.clientX,e.clientY);},true);

/* vuurwerk bij goede antwoorden en punten */
let celebSeq=null,celebTask=null;
function celebrate(){
  const st=S.state;if(!st)return;
  const tv=(S.owner&&S.view==='tv')||NET.tv;const player=!S.owner&&S.uid&&S.players[S.uid]&&!S.editing;
  FW.ambient(st.phase==='lobby'&&(tv||player));
  if(st.phase==='reveal'&&st.seq!==celebSeq){
    celebSeq=st.seq;
    if(tv&&st.q&&!st.q.task)FW.show(5);
    else if(player&&st.q&&!st.q.task){const g=st.q.test?(st.reveal?.answers?.[S.uid]?.c===st.reveal?.correct?600:0):(st.reveal?.gain?.[S.uid]||0);if(g>0)FW.show(g>=1500?14:g>=800?10:6);}
  }
  if(st.phase==='task'&&(tv||player)){
    const g=st.reveal?.gain||{};const key=st.seq+'|'+JSON.stringify(g);
    if(celebTask&&celebTask.split('|')[0]==String(st.seq)&&celebTask!==key){
      const prev=JSON.parse(celebTask.split('|').slice(1).join('|'));
      if(tv?Object.keys(g).some(k=>(g[k]||0)>(prev[k]||0)):(g[S.uid]||0)>(prev[S.uid]||0))FW.show(tv?3:6);}
    celebTask=key;
  }else celebTask=null;
}

/* vaste scorebalk */
const lastPts={};
function renderStrip(){
  const el=$('#strip');const st=S.state;const list=st?ranking():[];
  if(!st||!list.length){el.hidden=true;return;}
  el.hidden=false;
  const top=list[0].pts;
  el.innerHTML=list.map((p,i)=>{const lead=top>0&&p.pts===top;
    return `<div class="cell ${lead?'lead':''} ${p.id===S.uid?'mine-team':''}"><span class="rk">${avatar(p.id,32)}</span><span class="n">${esc(p.name)}${p.id===S.uid?' (jij)':''}</span><span class="s" data-sid="${p.id}">${p.pts}</span></div>`;}).join('');
  list.forEach(p=>{if(lastPts[p.id]!==undefined&&p.pts>lastPts[p.id]){const n=el.querySelector('[data-sid="'+p.id+'"]');n&&n.classList.add('bump');}lastPts[p.id]=p.pts;});
}
const _render=render;
render=function(){_render();celebrate();renderStrip();};
</script>
